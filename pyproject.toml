[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-ai-evaluation"
version = "0.1.0"
description = "Synthetic Trustworthy AI Evaluation book examples and utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mkdocs>=1.6",
  "numpy>=2.1",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "pymdown-extensions>=10.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
