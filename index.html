{ id:"I", title:"Sampling bias, stratification and weighting",
  gentle:`Reference Set 1 is 70% safari frames, because that is where the photographer had been. Production is nearer 40% safari, and the reviewer is much better on safari.

**The one idea.** A headline accuracy is the accuracy of the mixture in the set. If production has a different mixture, the headline describes a world that does not exist. The fix is to compute the accuracy for each kind of shooting and recombine them in production's proportions: **reweighting**.

**The example in words.** Say the reviewer is very good on safari frames and only fair on home-ground frames. A set that is mostly safari flatters it; a production stream that is mostly home ground will disappoint. Weighting the two accuracies by 40 and 60 instead of 70 and 30 gives the number production will actually see, and a wider interval, because the home-ground slice is smaller in the set.

**An everyday version.** A poll taken in one street on market day says what that street thought that day. To speak for the whole town, weight each district by its share of the town, not by how many people happened to walk past.

**So the answer is** to know the mixture in the set and the mixture in production, and to report the reweighted figure. The nine parts show the arithmetic and what it does to the interval.`,
  figure:{ title:"The same two accuracies, weighted two ways",
    gentle:`Both pictures use the same two numbers: 0.88 on safari frames, 0.74 at home. In the top picture the safari bar is wide because the set is 70% safari, so the average line sits high, at 0.838. In the bottom picture the bars are re-cut to production's shares, 40 and 60, and the same two heights now average to 0.796. Nothing was measured again; only the mix changed, and the mix is the whole four-point gap.`,
    caption:`Mosaics of the per-stratum accuracies: width is the stratum's share (the reference set's above, the target weights below), height its accuracy, and the line the weighted mean. The design effect in the calculator is the price of the mismatch in standard error.`,
    draw:(v,r)=>{ const n=v.n1+v.n2, W2=1-v.W1; return [
      {type:"bars",max:1,ylabel:"accuracy in the reference set's mix",bars:[{label:"safari",sub:`${fmt(100*v.n1/n,0)}% of the set`,width:v.n1/n,value:v.p1,cls:"f1"},{label:"home ground",sub:`${fmt(100*v.n2/n,0)}% of the set`,width:v.n2/n,value:v.p2,cls:"f2"}],ylines:[{y:r.naive,label:`naive ${fmt(r.naive,3)}`}]},
      {type:"bars",max:1,ylabel:"the same accuracies in production's mix",bars:[{label:"safari",sub:`${fmt(100*v.W1,0)}% of production`,width:Math.max(0.01,v.W1),value:v.p1,cls:"f1"},{label:"home ground",sub:`${fmt(100*W2,0)}% of production`,width:Math.max(0.01,W2),value:v.p2,cls:"f2"}],ylines:[{y:r.weighted,label:`weighted ${fmt(r.weighted,3)}`}]}]; } },
  question:`Reference Set 1 is 70% safari frames because that is where the photographer had been. Production is closer to 40% safari, 60% home ground, and the reviewer is much better on safari. What does the set's headline accuracy estimate, and how is the production accuracy recovered from it?`,
  principle:`A sample estimates the population it was drawn from, not the one you meant. When the reference set's mix of strata differs from the target population's, the naive metric is **biased** for the target, and no confidence interval will show it — the interval measures precision, not aim. If the strata are known and their target weights are known, **post-stratification** re-weights the per-stratum estimates to the target mix. What it cannot do is fix strata that are missing, or a bias inside a stratum.`,
  maths:`With strata \`s\`, per-stratum accuracy \`p̂_s\` on \`n_s\` rows and target weights \`W_s\` (summing to 1):

naive \`p̂ = Σ (n_s/n) p̂_s\`, weighted \`p̂_W = Σ W_s p̂_s\`

\`SE(p̂_W) = √( Σ W_s² p̂_s(1 − p̂_s)/n_s )\`

The weighted standard error is larger than the naive one whenever a heavily weighted stratum is thinly sampled: a stratum with 30% of the rows carrying 60% of the weight contributes \`0.6²/150\` rather than \`0.3²/150\` to the variance. The **design effect** of the weighting, \`SE_W²/SE_naive²\`, says how much precision the mismatch cost — and the cure for next time is to sample the reference set in the target proportions, or to oversample rare strata on purpose and weight them back down.`,
  assumptions:`- Strata are known for every row, in both the reference set and production.
- Within a stratum, the reference rows are representative of production rows in that stratum. Weighting corrects the mix between strata; it cannot correct a bias within one.
- The target weights are current. When the photographer changes what they shoot, the weights change (Lesson N).`,
  example:`Synthetic. Safari: 350 rows, accuracy 0.88. Home ground: 150 rows, accuracy 0.74. Naive accuracy \`= (350 × 0.88 + 150 × 0.74)/500 = 0.838\`, standard error 0.0165. Reweighted to the production mix of 40/60: \`0.4 × 0.88 + 0.6 × 0.74 = 0.796\`, standard error \`√(0.4² × 0.88 × 0.12/350 + 0.6² × 0.74 × 0.26/150) = 0.0226\`.

The set said 0.84 and production will experience about 0.80. The interval was never going to reveal a four-point gap that is not variance. And the price of estimating production from a badly mixed set is a standard error 37% larger than a set drawn in the right proportions would have given.`,
  pitfall:`Confusing a small sample with a biased one — a bigger sample from the same 70/30 mix converges precisely on the wrong number. Also: weighting to a target mix that was itself guessed, then reporting the weighted number with no note that its bias now depends on the guess.`,
  application:`Reference Set 1's manifest records the stratum mix and the production weights it is meant to represent; every headline metric is reported both naive and post-stratified to those weights, with the weighted standard error. New reference sets are drawn in target proportions with rare strata (Barred, macro) oversampled and weighted back. Strata missing from the set — the air show, say — are listed as *not covered* rather than silently absent.`,
  diagnostic:{ q:`Someone proposes fixing the bias by dropping 200 safari frames so the set becomes 150/150, "balanced". What does that do to bias and to precision, compared with weighting?`,
    a:`It changes the mix to 50/50, which is still not the 40/60 target, so the bias is reduced but not removed; and it throws away 200 rows of information, so precision falls for every metric, safari-specific ones most. Weighting uses every row and hits the target mix exactly. Balancing only makes sense when the goal is equal precision per stratum, which is a different goal.` },
  exercise:`Identify the two or three strata that matter most in your evaluation. Record the reference-set mix and your best estimate of the production mix. Compute naive and post-stratified headline metrics with their standard errors, and write one sentence on where the production-mix estimate came from and how sure you are of it.`,
  calc:{ inputs:[["n1","Stratum 1: rows",350,1,1e7,1],["p1","Stratum 1: accuracy",0.88,0,1,0.001],["W1","Stratum 1: target weight",0.4,0,1,0.01],["n2","Stratum 2: rows",150,1,1e7,1],["p2","Stratum 2: accuracy",0.74,0,1,0.001]],
    compute:(v)=>{ const n=v.n1+v.n2, W2=1-v.W1; const naive=(v.n1*v.p1+v.n2*v.p2)/n; const w=v.W1*v.p1+W2*v.p2;
      const seN=Math.sqrt(naive*(1-naive)/n), seW=Math.sqrt(v.W1*v.W1*v.p1*(1-v.p1)/v.n1+W2*W2*v.p2*(1-v.p2)/v.n2);
      return {naive,weighted:w,bias:naive-w,seNaive:seN,seW,deff:seW*seW/(seN*seN)}; },
    outputs:[["naive","naive accuracy",3],["weighted","post-stratified accuracy",3],["bias","bias of the naive estimate",3],["seNaive","SE naive",4],["seW","SE post-stratified",4],["deff","design effect of weighting",2]],
    expect:{naive:0.838,weighted:0.796,seNaive:0.0165,seW:0.0226},
    note:"Two strata; the second's target weight is 1 minus the first's." } },

{ id:"J", title:"Clustered and repeated observations",
  gentle:`Every standard error so far used 500 as the number of observations. The 500 frames came from 40 outings, and frames from one outing share the light, the subject and the photographer's mood that day.

**The one idea.** Frames from the same outing are alike, so 500 of them carry less information than 500 frames from 500 different days. The effective number of independent observations is somewhere between 40 and 500. Standard errors computed with 500 are too small: the intervals are narrower than the truth.

**The example in words.** If frames within an outing tend to agree with each other, a run that does badly on one hard outing loses many frames at once; that is one bad day, not many bad frames. Treating it as many independent misses overstates how sure you can be. The lesson estimates how much frames within an outing agree and shrinks the effective count accordingly.

**An everyday version.** Ask 500 people in 40 households what they think of the council and you have something closer to 40 opinions than 500: households talk to each other.

**So the answer is** to compute uncertainty on the unit that is actually independent, which here is closer to the outing than the frame. The nine parts derive the correction.`,
  figure:{ title:"Five hundred frames, forty days",
    gentle:`Each block is one outing and each square one of its frames, coloured by whether the reviewer got it right. The misses are not sprinkled evenly; they come in clumps, because a hard day is hard for every frame on it. Count the clumps rather than the squares and there is less evidence here than 500 suggests: the bars below put it at about 152 frames' worth. The pattern is synthetic, drawn to the lesson's correlation, and it is redrawn when the correlation changes.`,
    caption:`A synthetic reference set with the calculator's \`n\`, cluster count, accuracy and \`ρ\`: per-outing accuracy varies with standard deviation \`√(ρ p(1 − p))\`, and frames follow their outing. Below, rows counted against the effective sample size \`n/DEFF\`. The seed is fixed, so the picture is stable.`,
    draw:(v,r)=>{ const rg=S.rng(20240914), norm=()=>{ const u=Math.max(1e-12,rg()), w=rg(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*w); };
      const K=Math.min(60,Math.max(1,Math.round(v.clusters))), m=Math.min(25,Math.max(1,Math.round(v.n/v.clusters))), sd=Math.sqrt(Math.max(0,v.rho)*v.p*(1-v.p)); const blocks=[];
      for(let c=0;c<K;c++){ const pc=Math.max(0,Math.min(1,v.p+sd*norm())); const b=[]; for(let i=0;i<m;i++) b.push(rg()<pc?"f0":"f2"); blocks.push(b); }
      return [{type:"grid",blocks,blockCols:5,perRow:10,legend:[{cls:"f0",label:"verdict right"},{cls:"f2",label:"verdict wrong"}],blockLabel:`${K} outings of about ${m} frames${K<v.clusters||m<v.n/v.clusters?" (a sample of the set)":""}`},
        {type:"bars",max:Math.max(1,v.n),ylabel:"frames",bars:[{label:"frames counted",width:1,value:v.n,cls:"f0",text:tickN(v.n)},{label:"frames' worth of evidence",sub:`n / DEFF, with ρ = ${fmt(v.rho,2)}`,width:1,value:r.neff,cls:"f1",text:tickN(Math.round(r.neff))}]}]; } },
  question:`Reference Set 1 has 500 frames, and every standard error so far has used \`n = 500\`. The frames come from 40 outings, and frames from one outing share the light, the subject and the photographer's judgement that day. How many independent observations are there really?`,
  principle:`Rows that share a cause are **clustered**, and clustered rows carry less information than independent ones because part of what each row tells you, its neighbours already told you. The **intra-cluster correlation** ρ measures how much rows within a cluster resemble each other; the **design effect** converts it into how much larger the standard error is than the independent formula claims; and the **effective sample size** is the number of independent rows that would carry the same information. A thousand rows from six projects can be worth sixty.`,
  maths:`For clusters of average size \`m\` and intra-cluster correlation \`ρ\`,

\`DEFF = 1 + (m − 1) ρ\`, \`n_eff = n / DEFF\`, \`SE_clustered = SE_independent × √DEFF\`

ρ can be estimated from a one-way analysis of variance on the row outcomes grouped by cluster, or more simply: compute the per-cluster accuracies, take their variance, subtract the part that binomial sampling within clusters would produce, and divide by the total variance. With unequal cluster sizes use the mean of \`m²\` divided by the mean of \`m\` in place of \`m\`.

The cluster bootstrap (Lesson G) sidesteps the formula: resample outings, keep their rows, recompute, and the width of the result already includes the design effect. When per-document metrics are what the decision needs, aggregate to the document first and treat documents as the sample, which is the honest unit and often the simplest.`,
  assumptions:`- Clusters are the right level: outings share causes and are themselves roughly independent. If outings inside a trip also share causes (the same camera fault all week), the trip is the cluster and there are six of them.
- ρ is roughly constant across clusters, or the estimate is an average over them.
- The metric is a mean over rows; for per-document metrics the clustering is already inside the unit.`,
  example:`Synthetic. 500 frames, 40 outings, \`m = 12.5\`. Per-outing accuracies vary far more than binomial noise would explain; the estimated intra-cluster correlation is \`ρ = 0.20\`.

\`DEFF = 1 + 11.5 × 0.20 = 3.30\`, \`n_eff = 500/3.30 = 152\`, and the standard error of accuracy is \`0.0164 × √3.30 = 0.0164 × 1.82 = 0.0298\` — not 0.0164. Lesson A's three-point gap, already only 1.25 independent standard errors, is about 0.7 clustered ones. Lesson E's power calculation was for 500 rows; the set had the power of about 150. Everything computed on \`n = 500\` was optimistic by a factor of 1.8.`,
  pitfall:`Counting rows. A project-level evaluation of "1,000 rows" from six projects with ρ = 0.3 has \`DEFF ≈ 50\` and an effective size of about 20; its confidence intervals, computed on rows, are off by a factor of seven. The paired comparison of Lesson F is not exempt: discordant rows cluster too, and the cluster bootstrap on the paired difference is the fix.`,
  application:`Reference Set 1's manifest states the cluster structure (rows in outings in projects) and an estimated ρ per primary metric. All intervals are produced by a cluster bootstrap over outings, and the report prints \`n_eff\` beside \`n\`. New reference sets favour *more outings with fewer frames each* over the reverse, because for a fixed row budget the effective size grows with the number of clusters, not with rows per cluster.`,
  diagnostic:{ q:`You can add 500 more frames to the set: either 10 new outings of 50 frames, or 50 new outings of 10 frames. With ρ = 0.2, which adds more information about the reviewer, and roughly how much?`,
    a:`For the 10 × 50 option, \`DEFF = 1 + 49 × 0.2 = 10.8\` and \`n_eff ≈ 46\`. For 50 × 10, \`DEFF = 1 + 9 × 0.2 = 2.8\` and \`n_eff ≈ 179\`. The same 500 frames carry about four times the information when spread across more outings. Diversity of clusters, not volume of rows, is what buys precision.` },
  exercise:`Group your evaluation rows by the document or project they came from. Compute per-cluster accuracy, estimate ρ (or just run a cluster bootstrap), compute DEFF and \`n_eff\`, and rewrite the headline interval. Then re-read your last "significant" regression in the light of the new standard error.`,
  calc:{ inputs:[["n","Rows",500,2,1e9,1],["clusters","Clusters (documents)",40,1,1e9,1],["rho","Intra-cluster correlation ρ",0.2,0,1,0.01],["p","Accuracy",0.84,0.001,0.999,0.001]],
    compute:(v)=>{ const m=v.n/v.clusters, deff=1+(m-1)*v.rho, se=S.seProp(v.p,v.n); return {m,deff,neff:v.n/deff,seInd:se,seClu:se*Math.sqrt(deff),factor:Math.sqrt(deff)}; },
    outputs:[["m","rows per cluster",1],["deff","design effect",2],["neff","effective sample size",0],["seInd","SE, independent rows",4],["seClu","SE, clustered",4],["factor","SE inflation factor",2]],
    expect:{deff:3.30,neff:152,seInd:0.0164,seClu:0.0298,factor:1.82},
    note:"Try 1,000 rows in 6 clusters with ρ = 0.3." } },

{ id:"K", title:"Test-set governance and reproducibility",
  gentle:`The candidate scored 0.818 on "the reference set" and the release 0.84 on "the reference set". Between the two runs sixty frames from a new trip were added and one barred label was changed.

**The one idea.** Two numbers from two different sets are not comparable, however similar the sets' names. **Governance** means the set has a version, a comparison is made on one frozen version, and every change to a label is recorded with a reason and a date.

**The example in words.** The sixty new frames may be harder than the old ones; the changed label flips one frame for both runs. Either could explain part of the two-point gap, and nothing in the two numbers says which. Rerun both versions on the same frozen set and the question answers itself.

**An everyday version.** Two exam results cannot be compared if the paper changed between them. First find out what changed; then compare the questions both papers shared.

**So the answer is** version the reference set, freeze it for the comparison, and log the labels. The nine parts give the checklist and the reporting lines.`,
  figure:{ title:"Sixty new frames, one diluted number",
    gentle:`The first block of squares is the 500 frames both versions were scored on: the candidate got 85% of them right, and that is the fair comparison with the release's 0.84. The strip after them is the sixty air-show frames added to the set, a kind of shooting the reviewer had never seen, and it got barely half of those. Pool the two and the number reads 0.818. The bars underneath show the dilution: a good score on the shared rows, a poor one on the new rows, and a pooled figure that describes neither.`,
    caption:`Rows as frames, shared rows first and added rows after, right and wrong marked. Below, accuracy on the shared rows, on the added rows, and pooled, with bar widths proportional to the row counts; the pooled line is the row-weighted mean.`,
    draw:(v,r)=>{ const k1=Math.round(v.n1*v.p1), k2=Math.round(v.n2*v.p2); const g=FIG.cells([[k1,"f0"],[v.n1-k1,"fx"],[k2,"f1"],[v.n2-k2,"f2"]]);
      return [{type:"grid",cells:g.cells,per:g.per,legend:[{cls:"f0",label:`shared row, right (${k1})`},{cls:"fx",label:`shared row, wrong (${v.n1-k1})`},{cls:"f1",label:`added row, right (${k2})`},{cls:"f2",label:`added row, wrong (${v.n2-k2})`}]},
        {type:"bars",max:1,ylabel:"accuracy",bars:[{label:"shared rows",sub:`${tickN(v.n1)} rows`,width:v.n1,value:v.p1,cls:"f0"},{label:"added rows",sub:`${tickN(v.n2)} rows`,width:Math.max(1,v.n2),value:v.p2,cls:"f2"}],ylines:[{y:r.pooled,label:`pooled ${fmt(r.pooled,3)}`}]}]; } },
  question:`The candidate scored 0.818 on "the reference set" and the release scored 0.84 on "the reference set". Sixty frames from a new trip were added between the two runs, and one Barred label was re-adjudicated. Is the two-point drop the candidate's, the new frames', or the label's?`,
  principle:`A metric is a function of four things: the system, the data, the ground truth and the scorer. Change any one and the number changes, and if two changed at once the comparison is **confounded** — it cannot be attributed. Evaluation is only measurement when the other three are held fixed and versioned, which is what a reference set's **governance** is for: a frozen, named, hashed set; ground truth under change control with an adjudication log; scoring code with a version; and a manifest that says what population the set claims to represent and what it does not cover. Ground truth is itself a measurement, with its own error, and the manifest says how much.`,
  maths:`Composition change decomposes exactly. If a set of \`n_1\` rows on which the candidate scores \`p_1\` is extended by \`n_2\` rows on which it scores \`p_2\`, the pooled score is \`(n_1 p_1 + n_2 p_2)/(n_1 + n_2)\` — the old score diluted toward the new rows' score. Report the shared-rows comparison first and the added rows separately.

**Measurement error in ground truth.** If two competent annotators agree on a fraction \`κ_obs\` of verdicts, the reviewer's accuracy against one of them cannot meaningfully exceed roughly that agreement level, and a comparison between two systems on rows where annotators disagree is a comparison against noise. Cohen's κ corrects the raw agreement for chance: \`κ = (p_o − p_e)/(1 − p_e)\` with \`p_e\` the agreement expected from the marginal label frequencies.

**Reproducibility** is arithmetic: same set hash, same ground-truth version, same scorer version, same seed, same number. If those match and the number differs, the system changed; if any of them differ, the comparison is not yet a comparison.`,
  assumptions:`- The manifest is kept. Governance that lives in someone's memory is not governance.
- Re-adjudication of ground truth is logged with a reason and applied to *both* sides of any comparison, re-running the old system if needed.
- The scorer is deterministic, or its randomness is seeded and the seed is part of the version.`,
  example:`Synthetic. Reference Set 1, version 1: 500 rows. The release scored 0.84 on it. Version 2 added 60 frames from an air show — a scenario the reviewer had never seen — and the candidate scored **0.85 on the shared 500** and 0.55 on the 60 new rows, pooling to \`(500 × 0.85 + 60 × 0.55)/560 = 0.818\`. Composition alone moved the number by −0.032.

The "two-point regression" was a one-point *improvement* on comparable rows plus a new scenario the set had not covered before. Both facts matter; the pooled number conveyed neither. The re-adjudicated Barred label moved one row, which is 0.002 of accuracy and 10% of Barred recall — so it is noted in the Barred line and nowhere else.

Second example, the story-draft reader: two editors annotate 200 draft notes as *useful* or *not*. They agree on 160, and each marks about 55% useful, so \`p_e = 0.55² + 0.45² = 0.505\` and \`κ = (0.80 − 0.505)/(1 − 0.505) = 0.60\` — "moderate to substantial", and a hard ceiling on how well any system can be shown to agree with either editor on this task. An AI reader reporting 0.85 agreement with editor 1 has exceeded what editor 2 achieves, which is a reason to check for leakage, not to celebrate.`,
  pitfall:`"The reference set" as a name for a moving thing. Silent additions, silent label fixes, a scorer upgrade that changed a similarity threshold — each shows up as a system change. And treating ground truth as truth: a system that agrees with one annotator 95% of the time when annotators agree with each other 80% of the time has been trained on that annotator, not on the task.`,
  application:`Reference Set 1 has a manifest (the card on the **Cards** page): version, row count, hash, cluster structure, stratum mix and target weights, scenario coverage and known gaps, annotator agreement per field, scorer version and seed, owner and change log. Every evaluation report names the manifest version. Additions create a new version, and the first comparison after any addition is a paired one on the shared rows (Lesson F).`,
  diagnostic:{ q:`A stakeholder asks for the reference set to be "refreshed every month with recent frames so it stays representative". What does this do to release-over-release comparisons, and how can both goals be met?`,
    a:`Every monthly comparison becomes confounded with composition change. Meet both goals with two sets: a frozen **comparison** set for release-over-release paired analysis, and a rolling **coverage** set that tracks representativeness and drift (Lesson N), with the frozen set replaced by a new frozen version on a stated cadence and both old and new systems scored on both versions at the changeover.` },
  exercise:`Write the manifest for your current reference set from the card on the Cards page, filling every line, including the ones you cannot fill — those are the findings. Compute annotator agreement (raw and κ) on at least one field if you have two annotators, and if you do not, record that the ground truth's error is unknown.`,
  calc:{ inputs:[["n1","Shared rows",500,1,1e9,1],["p1","Accuracy on shared rows",0.85,0,1,0.001],["n2","Added rows",60,0,1e9,1],["p2","Accuracy on added rows",0.55,0,1,0.001],["agree","Annotator agreement (raw)",0.80,0,1,0.001],["marg","Marginal rate of the positive label",0.55,0,1,0.001]],
    compute:(v)=>{ const pooled=(v.n1*v.p1+v.n2*v.p2)/(v.n1+v.n2); const pe=v.marg*v.marg+(1-v.marg)*(1-v.marg); return {pooled,dilution:pooled-v.p1,pe,kappa:(v.agree-pe)/(1-pe)}; },
    outputs:[["pooled","pooled accuracy after addition",3],["dilution","change due to composition alone",3],["pe","agreement expected by chance",3],["kappa","Cohen's κ",2]],
    expect:{pooled:0.818,dilution:-0.032,pe:0.505,kappa:0.60},
    note:"κ here assumes both annotators use the positive label at the same marginal rate." } },

{ id:"L", title:"Decision-oriented evaluation reporting",
  gentle:`Everything from A to K is on the table for the candidate. The release meeting is in an hour and wants one page.

**The one idea.** A decision needs the metric, its interval, the unit it was computed on, what changed in the set, the rule agreed in advance, and what evidence would change the decision. Everything else is background. Writing the rule down before the numbers arrive is what keeps the numbers from being read to taste.

**The example in words.** The paired difference is 0.03 with an interval from 0.001 to 0.059, which is a real but small change; the barred recall may have fallen, which is the thing that cannot be undone; and there is a kind of shooting the candidate has never seen. The page says those three things, in that order, and then the rule: what the group said, before the run, it would take to ship.

**An everyday version.** A doctor does not read a blood test to taste. The threshold for treating was decided before the result came back, and the result is read against it, whichever way it falls.

**So the answer is** one page with the six items. The nine parts give the template, and the reference card holds it.`,
  figure:{ title:"Where the bar falls decides the word",
    gentle:`The axis is how much better or worse the candidate is; the three coloured zones are the three verdicts, and their edges are the thresholds the group wrote down before the run. The bar is the interval for the candidate. If the whole bar sits in the green, ship; if the whole bar sits in the red, hold; if it straddles a line, the honest word is "collect evidence". The dot is the point estimate, and the picture shows why it is not enough on its own.`,
    caption:`The one-sided 90% interval \`d ± 1.645 SE\` against the zones set by \`δ_harm\` and \`δ_gain\`. Enter \`d = −0.03\` for the worked example's actual sign and watch the bar cross into the red.`,
    draw:(v,r)=>{ const min=Math.min(-0.08,r.lcb-0.02), max=Math.max(0.08,r.ucb+0.02); return {type:"intervals",min,max,xlabel:"candidate minus release",
      bands:[{from:min,to:-v.dHarm,cls:"bad",label:"hold: meaningfully worse"},{from:-v.dHarm,to:v.dGain,cls:"warn",label:"not shown either way"},{from:v.dGain,to:max,cls:"ok",label:"ship: meaningful gain"}],
      rows:[{label:"candidate, 90% interval",lo:r.lcb,hi:r.ucb,x:v.d,cls:"f1"}],marks:[{x:0,label:"no change"}]}; } },
  question:`Everything from A to K is on the table for the candidate: a paired difference of 0.03 with interval 0.001 to 0.059, a Barred recall that may have fallen, an air show it has never seen. The release meeting is in an hour and wants one page. What goes on it, and what is the decision rule?`,
  principle:`An evaluation report exists to support a decision, and the decision has a small number of outcomes: **ship**, **hold**, **collect specific evidence**. The report's job is to put the evidence in the form that rule needs — an interval compared against a minimum meaningful effect, per class, on the frozen set, with the assumptions and the uncovered scenarios stated — and to say plainly what the evidence does *not* show. A point estimate compared to zero is not a decision rule. A lower confidence bound compared to a written threshold is.`,
  maths:`Let \`d\` be the paired improvement (candidate minus release) with standard error \`SE\`, and δ the minimum meaningful effect. Because the decision is one-sided — we need to know the candidate is not worse — use the one-sided lower bound:

\`LCB_95 = d − 1.645 SE\`

Decision rule, per primary metric: ship if \`LCB_95 > −δ_harm\` (the candidate is not meaningfully worse) and, where an improvement is claimed, \`LCB_95 > δ_gain\`; hold if the upper bound is below \`−δ_harm\` (meaningfully worse); otherwise **collect evidence** — the interval straddles the threshold, and the report says what data would narrow it (Lesson E's \`n\`, or Lesson F's discordant rows).

The same rule at 90% two-sided is \`d ± 1.645 SE\`; the choice of level is a risk decision, recorded in the minimum-meaningful-effect statement, not a convention borrowed from a textbook.`,
  assumptions:`- The thresholds δ were written before the run (Lesson D).
- The interval is the right one: paired (Lesson F), cluster-corrected (Lesson J), on the frozen set (Lesson K).
- The primary metrics were named in advance; anything found by exploring is labelled exploratory and does not enter the rule (rule 9).`,
  example:`Synthetic. The candidate's verdict accuracy, paired against the release on Reference Set 1 v1: \`d = −0.030\` (the release was better), \`SE = 0.0148\`, so the candidate's one-sided 95% lower bound on *improvement* is \`−0.030 − 0.024 = −0.054\` and its upper bound \`−0.006\`. With δ_harm for verdict accuracy set at 0.02 (Lesson D: 40 frames a month), the interval lies entirely below zero and mostly below −0.02: **hold**, with the 55 discordant rows attached for reading.

Had the sign been the other way — an improvement of 0.030 with the same standard error — the lower bound would be \`0.030 − 0.024 = 0.006\`: above zero, so the improvement is probably real, but below a δ_gain of 0.01, so it has not been shown to be *meaningful*. The honest line is "probably improved, not yet shown to be worth the change; 1,200 more paired frames would settle it". That is a **collect evidence** verdict, and it is the most common one.`,
  pitfall:`The one-page report that leads with accuracy to three decimals, no interval, no \`n\`, no per-class line, and the word "significant" doing the work of a decision. And the opposite failure: a report so hedged that it makes no recommendation. The rule makes the recommendation; the report's hedging is where the assumptions live.`,
  application:`The report template is on the Cards page. One page: the decision and the rule; per primary metric, the paired difference, its cluster-corrected interval, δ, and the verdict (ship / hold / collect); the per-class table with Barred first; scenario coverage and gaps; manifest version, scorer version, seed; what would change the verdict. The last line is the **session note** of these lessons: principle, application, assumption to check, one task, one line for the interpretation guide.`,
  diagnostic:{ q:`The report says "accuracy 0.83 (95% CI 0.80–0.86), target 0.85: target not met". A stakeholder replies that 0.85 is inside the interval so the target might be met, and asks to ship. Who is right?`,
    a:`Both are reading the interval as if it were the rule. The rule for "target met" should be a lower bound above the target; 0.80 is not, so the target has not been *shown* to be met. Nor has it been shown to be missed. The right verdict is collect evidence: the interval straddles the target, and the report should say how many more paired frames would resolve it — and whether the target was a δ set in advance or a round number.` },
  exercise:`Rewrite your last release report on one page using the card. Apply the rule to each primary metric and write the verdict word. Where the verdict is "collect evidence", state exactly what evidence and how much.`,
  calc:{ inputs:[["d","Paired improvement (candidate − release)",0.03,-1,1,0.001],["se","Standard error of d",0.0148,0.0001,1,0.0001],["dHarm","δ: meaningful harm",0.02,0,1,0.001],["dGain","δ: meaningful gain",0.01,0,1,0.001]],
    compute:(v)=>{ const lcb=v.d-1.645*v.se, ucb=v.d+1.645*v.se; let verdict, cls;
      if(ucb< -v.dHarm){verdict="HOLD: meaningfully worse (upper bound below −δ harm).";cls="bad";}
      else if(lcb> v.dGain){verdict="SHIP: meaningful improvement shown (lower bound above δ gain).";cls="ok";}
      else if(lcb> -v.dHarm && v.d<=v.dGain && lcb<=v.dGain && ucb>=0 && lcb>=0){verdict="SHIP-AS-NEUTRAL: probably improved, improvement not shown to be meaningful.";cls="warn";}
      else if(lcb> -v.dHarm){verdict="SHIP-AS-NEUTRAL or COLLECT: not meaningfully worse; improvement unproven.";cls="warn";}
      else {verdict="COLLECT EVIDENCE: interval straddles the harm threshold.";cls="warn";}
      return {lcb,ucb,verdict,cls}; },
    outputs:[["lcb","one-sided 95% lower bound",3],["ucb","one-sided 95% upper bound",3]],
    expect:{lcb:0.006,ucb:0.054},
    verdictKey:"verdict",
    note:"Enter d = −0.03 for the worked example's actual sign." } },

{ id:"M", title:"Confidence, calibration and combining scores",
  gentle:`Beside every verdict the reviewer gives a confidence. The photographer wants to auto-accept anything above 0.9. Does 0.9 mean nine in ten are right?

**The one idea.** Only if the reviewer is **calibrated**: group its verdicts by the confidence it stated and count how often each group was right. If the frames it called 0.9 are right 70% of the time, 0.9 is a label, not a probability. And when several component scores combine, the product, the mean and the minimum are three different claims about the whole.

**The example in words.** Take every verdict the reviewer marked between 0.85 and 0.95 and check them against the photographer. If about nine in ten are right, the threshold can be trusted; if fewer, the auto-accept rule needs a higher bar or a corrected score. For the combined confidence: a product says every component must be right, a minimum says the weakest link decides, a mean says they trade off. Pick the one that matches what "the whole verdict is right" means.

**An everyday version.** A forecaster who says "90% chance of rain" is honest if, over all the days they said it, it rained on about nine in ten. If it rained on six in ten, the number was a mood, not a probability.

**So the answer is** measure calibration before trusting a threshold, and combine scores by the meaning you need. The nine parts show the reliability table and the three combinations.`,
  figure:{ title:"Does 0.9 mean nine in ten?",
    gentle:`Across the bottom is the confidence the reviewer stated; up the side is how often it was actually right. A perfectly honest score would sit on the dashed line. Each dot is one group of frames, with a whisker for the range its count of frames allows. The 0.9 dot is close to the line and its whisker is short, so nine in ten is about right there. The 0.7 dot sits below the line: at that confidence the reviewer is a little surer than it should be.`,
    caption:`A reliability diagram: observed accuracy \`o_j\` against stated confidence \`c̄_j\`, one point per bin with its Wilson interval and a size proportional to \`n_j\`. The ECE in the calculator is the row-weighted distance from the diagonal.`,
    draw:(v,r)=>{ const cs=[0.1,0.3,0.5,0.7,0.9], ns=[v.n1,v.n2,v.n3,v.n4,v.n5], ks=[v.k1,v.k2,v.k3,v.k4,v.k5]; const pts=[]; const big=Math.max(1,...ns);
      cs.forEach((c,j)=>{ if(!ns[j]) return; const w=S.wilson(ks[j],ns[j],1.96); pts.push({x:c,y:ks[j]/ns[j],lo:w[0],hi:w[1],r:4+8*Math.sqrt(ns[j]/big),label:`${ns[j]} rows`}); });
      return {type:"xy",xmin:0,xmax:1,ymin:0,ymax:1,diagonal:true,xlabel:"stated confidence",ylabel:"how often right",series:[{points:pts,cls:"f1"}]}; } },
  question:`Beside every verdict the reviewer emits a confidence, and the photographer wants to auto-accept verdicts above 0.9 without looking. Does 0.9 mean nine in ten are right? And when the reviewer's four components each emit a score, is the product, the mean or the minimum the confidence of the whole?`,
  principle:`A score is a **probability** only if, among rows given that score, the stated fraction turn out right; that property is **calibration**, and it is an empirical claim to be tested on the reference set, per slice, not a property of the number being between 0 and 1. Scores from different components have different semantics — one is a softmax margin, one a retrieval similarity, one a self-reported estimate — and there is no formula for combining them that does not inherit assumptions about what each means and whether their errors are independent. **System-level trust is not the average of component confidence.** It is measured end to end, like any other metric, and expressed in the vocabulary of Lessons A to L.`,
  maths:`Bin rows by stated confidence. In bin \`j\` with \`n_j\` rows, mean stated confidence \`c̄_j\` and observed accuracy \`o_j\`, the **expected calibration error** is

\`ECE = Σ_j (n_j/n) |o_j − c̄_j|\`

The **Brier score** \`(1/n) Σ (s_i − y_i)²\` rewards both calibration and sharpness; a reliability diagram plots \`o_j\` against \`c̄_j\`. Each \`o_j\` is a proportion with a Wilson interval (Lesson B) on \`n_j\` rows, so a bin of 30 rows says little.

**Selective prediction.** Auto-accept above threshold \`t\`: coverage is the fraction of rows above \`t\`, and the accuracy among them is what matters. A well-calibrated score gives accuracy ≈ mean confidence in that region; the trade-off curve of accuracy against coverage is the object to choose \`t\` on.

**Combining.** The reviewer has four components and each emits a number in [0, 1]:

| Component | Its score | What it actually is |
| Frame reader | 0.90 | a heuristic quality index for the decoded frame |
| Verdict classifier | 0.90 | a claimed probability that the verdict is correct |
| Evidence locator | 0.90 | a ranking margin for the region it chose |
| Note writer | 0.90 | a self-check score for its own text |

The shared range is real; the shared meaning is not. If two scores were independent, calibrated probabilities of independent events, their product would be the probability of both — three ifs, each testable, each usually false (the components see the same frame, and an upstream failure raises every downstream error rate). Every composition rule inherits assumptions:

| Rule | Assumes | Fails when |
| minimum | the weakest link dominates risk | one noisy component vetoes safe cases |
| maximum | one strong signal justifies action | an upstream failure is masked by a confident downstream score |
| mean or weighted mean | compatible semantics and stable weights | it produces a plausible number with no event behind it |
| product | independent, calibrated probabilities | correlated failures make it far too pessimistic or optimistic |
| learned combiner | held-out end-to-end labels | the mix drifts from the training population |

Prefer keeping the vector of scores and learning a calibrated combiner on held-out rows against the **end-to-end** outcome, or converting to a small set of risk categories with a per-category measured accuracy. System-level trust is validated on the end-to-end outcome; it cannot be inferred from component scores.`,
  assumptions:`- The calibration set is separate from anything the score was fitted on, and represents the production mix (Lesson I); calibration drifts with the mix.
- Bins have enough rows for their intervals to be narrower than the gaps you care about.
- Independence claims between components are tested on the reference set, not assumed from the architecture.`,
  example:`Synthetic. Reviewer verdict confidence on Reference Set 1, five bins:

| Stated confidence | Rows | Correct | Observed accuracy |
| 0.1 | 50 | 3 | 0.060 |
| 0.3 | 80 | 20 | 0.250 |
| 0.5 | 120 | 62 | 0.517 |
| 0.7 | 150 | 98 | 0.653 |
| 0.9 | 100 | 93 | 0.930 |

\`ECE = 0.036\`. The reviewer is slightly under-confident at the bottom, slightly over-confident at 0.7, and at 0.9 it is right 93 times in 100 (Wilson 0.863 to 0.966). Auto-accepting above 0.9 means auto-accepting one wrong verdict in about fourteen; whether that is acceptable is a Lesson D question, and it is a different question for a Barred frame than for a Folder one — so the calibration table must be repeated per class, where the 0.9 bin for Barred will have about two rows in it and say nothing.`,
  pitfall:`Reading a confidence as a probability because it is between 0 and 1. Averaging four component scores into one "system confidence" and putting it in a user interface. Calibrating once, globally, on the reference set of one year and never per slice or again. Treating a small ECE as a clean bill: ECE depends on the bins chosen, lets over- and under-confidence in different bins cancel, says nothing about discrimination (a score that is 0.84 for every row is perfectly calibrated and useless), can look fine in aggregate while one class or scenario is badly off, and never asks whether the score targets the event the decision needs. And the similarity version from Lesson C: a similarity score used as a confidence for a text field without ever measuring its accuracy against judged usefulness.`,
  application:`The manifest carries a **confidence semantics card** per score the reviewer emits (Cards page): what event it refers to, how it is produced, whether it claims to be a probability, on what population it was calibrated, and which decisions it may support. The auto-accept threshold is chosen from the accuracy–coverage curve per class, with Barred excluded from auto-accept entirely, and the calibration table is re-run on the rolling coverage set (Lesson N).`,
  diagnostic:{ q:`A component that retrieves evidence emits a similarity score, and the classifier emits a softmax probability. An engineer multiplies them and reports the product as "confidence that the verdict is correct and supported". Name the three claims this makes and how each would be tested.`,
    a:`(1) That each score is a calibrated probability of its own event — test each with a calibration table. (2) That the two events are independent given the frame — test whether the classifier's error rate differs between high- and low-similarity rows. (3) That "correct and supported" is the conjunction — test the product itself with a calibration table against the joint outcome. If any test fails, keep the two scores separate or learn a combiner on held-out rows.` },
  exercise:`Build the five-bin calibration table for one score your system emits, with a Wilson interval per bin and the ECE. Do it per class for the class that matters most and record how many rows the top bin has. Then write the confidence semantics card for that score.`,
  calc:{ inputs:[["n1","0.1 bin: rows",50,0,1e7,1],["k1","0.1 bin: correct",3,0,1e7,1],["n2","0.3 bin: rows",80,0,1e7,1],["k2","0.3 bin: correct",20,0,1e7,1],["n3","0.5 bin: rows",120,0,1e7,1],["k3","0.5 bin: correct",62,0,1e7,1],["n4","0.7 bin: rows",150,0,1e7,1],["k4","0.7 bin: correct",98,0,1e7,1],["n5","0.9 bin: rows",100,0,1e7,1],["k5","0.9 bin: correct",93,0,1e7,1]],
    compute:(v)=>{ const cs=[0.1,0.3,0.5,0.7,0.9], ns=[v.n1,v.n2,v.n3,v.n4,v.n5], ks=[v.k1,v.k2,v.k3,v.k4,v.k5]; const n=S.sum(ns); let ece=0, brier=0;
      ns.forEach((nj,j)=>{ if(nj){ const o=ks[j]/nj; ece+=nj/n*Math.abs(o-cs[j]); brier+=ks[j]*(cs[j]-1)**2+(nj-ks[j])*cs[j]**2; } });
      const top=S.wilson(ks[4],ns[4]||1,1.96);
      return {ece,brier:brier/n,o5:ns[4]?ks[4]/ns[4]:NaN,o5lo:top[0],o5hi:top[1],cover:ns[4]/n}; },
    outputs:[["ece","expected calibration error",3],["brier","Brier score",3],["o5","accuracy in the 0.9 bin",3],["o5lo","0.9 bin Wilson low",3],["o5hi","0.9 bin Wilson high",3],["cover","coverage of auto-accept at 0.9",3]],
    expect:{ece:0.036,o5:0.930,o5lo:0.863,o5hi:0.966},
    note:"Bin centres are fixed at 0.1, 0.3, 0.5, 0.7, 0.9; the Brier score uses the bin centre as each row's stated score." } },

{ id:"N", title:"Drift and monitoring",
  gentle:`The reviewer shipped. Three months on, the keeper rate it reports has fallen from 12% to 7%, and someone asks whether it has degraded. The reviewer has not changed.

**The one idea.** The system is the same; the world it sees is not. A new camera, a month of macro, a photographer in a mood: each changes what comes in, and a reviewer built on last year's frames answers today's frames differently. That is **drift**, and it comes in kinds: the inputs changed, the truth changed, or the link between them changed.

**The example in words.** Compare this month's frames to the reference set: the light, the subjects, the kinds of shooting. If the mix has moved, the reported rate should move with it and says nothing about the reviewer. Where truth arrives late, keep scoring a small labelled sample every week; that line, not the raw rate, says whether the reviewer still agrees with the photographer.

**An everyday version.** A shop's takings fell this month. Before blaming the staff, check whether the street was closed for roadworks: same shop, different passers-by.

**So the answer is** to monitor the inputs and a small labelled stream separately, and to read the raw rate as a symptom, not a verdict. The nine parts set the monitors up.`,
  figure:{ title:"Same reviewer, different month",
    gentle:`The top pair of pictures is the example's decomposition. Within each kind of shooting the keeper rate is what it was at baseline: 5% on macro frames, 13% on the rest. What changed is the width of the bars, because this month was mostly macro, and that alone drags the overall line from about 0.12 down to about 0.07. The reviewer did nothing different; the photographer did. The last picture is the other half of the lesson: check once a week at the usual 5% level and, by the end of a year, the chance of at least one false alarm from an unchanged system has climbed to 0.93.`,
    caption:`Above, the example's strata as mosaics (width is the stratum's share of the period, height its keeper rate, the line the overall rate): baseline mix, then this month's; these two are the example's fixed figures, not the calculator's. Below, \`1 − (1 − α)^checks\` against the number of checks, from the calculator's α and checks per year.`,
    draw:(v,r)=>{ const pts=[]; const K=Math.max(1,Math.min(400,Math.round(v.checks))); for(let k=1;k<=K;k++) pts.push({x:k,y:1-Math.pow(1-v.alpha,k)});
      return [{type:"bars",max:0.2,ylabel:"keeper rate at baseline",bars:[{label:"macro",sub:"15% of frames",width:0.15,value:0.05,cls:"f3"},{label:"other shooting",sub:"85% of frames",width:0.85,value:0.13,cls:"f0"}],ylines:[{y:0.12,label:"overall 0.12"}]},
        {type:"bars",max:0.2,ylabel:"keeper rate this month",bars:[{label:"macro",sub:"70% of frames",width:0.7,value:0.05,cls:"f3"},{label:"other shooting",sub:"30% of frames",width:0.3,value:0.13,cls:"f0"}],ylines:[{y:0.07,label:"overall 0.07"}]},
        {type:"xy",xmin:0,xmax:K,ymin:0,ymax:1,xlabel:"checks made so far in the year",ylabel:"chance of at least one false alarm",series:[{points:pts,cls:"f2",line:true,label:`after ${K} checks: ${fmt(r.famAlarm,2)}`}]}]; } },
  question:`The reviewer shipped. Three months later the weekly Keeper rate it reports has fallen from 12% to 7%, and someone asks whether the reviewer has degraded. The reviewer has not changed. The photographer has a new camera, has been shooting macro all month, and has been in a mood. Which of these is drift, and what does monitoring have to establish before anyone touches the model?`,
  principle:`Monitoring is the reference-set evaluation continued into a population that is allowed to change. Everything in Lessons A to M still applies, with one addition: a difference between this week and the baseline can come from the **system**, from the **inputs** (covariate shift: a new camera, a macro month), from the **relationship** between inputs and truth (concept drift: the photographer's taste moved), or from the **labels** arriving late and biased (only the frames that got looked at have ground truth). Monitoring's first job is to tell those apart, and its second is not to raise false alarms every week, because weekly tests at α = 0.05 will.`,
  maths:`For a monitored proportion with baseline \`p_0\` and this week's \`k\` of \`n\`: \`z = (k/n − p_0)/√(p_0(1 − p_0)/n)\`. But 52 weekly tests at α = 0.05 raise at least one false alarm with probability \`1 − 0.95⁵² = 0.93\` in a year of an unchanged system. Options: a stricter per-check α (Bonferroni: 0.05/52 ≈ 0.001), a **sequential** method such as CUSUM that accumulates evidence across weeks, or — the engineering answer — alarms defined on the minimum meaningful effect rather than on significance, since with enough production rows everything is significant.

**Decomposing a shift.** Stratify by the suspected cause (camera body, scenario) and compare within strata (Lesson I). If within-stratum rates are stable and only the mix moved, it is covariate shift and the reviewer is fine; if within-stratum rates moved, something about frames-to-verdicts changed. A labelled sample drawn at random from production, not just the frames someone chose to check, is the only thing that can distinguish concept drift from selective labelling.`,
  assumptions:`- The baseline was measured on a population comparable to production at the time (Lesson I), and its own uncertainty is known.
- Stratum membership is logged for production rows.
- A random labelled sample exists, or is being collected at a stated rate; without it, monitoring sees only what was looked at.`,
  example:`Synthetic. Baseline Keeper rate 0.12, measured well. This week: 28 keepers flagged in 400 frames, \`p̂ = 0.070\`, standard error under the baseline \`0.0162\`, \`z = −3.08\`, \`p = 0.002\`. Highly significant, and uninformative on its own: over a year of weekly checks at 0.05 the chance of at least one false alarm is 0.93, and this one may be real for the wrong reason.

Stratified by scenario, macro frames were 70% of the week against 15% at baseline, and the Keeper rate within macro (0.05) and within the rest (0.13) each match their baseline strata. The drop is covariate shift: the photographer shot macro. The reviewer's calibration table on the labelled sample from the month is unchanged. Nothing about the model needs touching; what needs touching is the alarm, which should compare within strata or against a mix-adjusted baseline.`,
  pitfall:`Retraining on an alarm. Alarming on significance with production-scale \`n\`, where a 0.2-point shift is "significant" and irrelevant. Trusting labels that only exist for frames someone chose to look at — usually the ones that looked wrong. And the quiet one: a baseline measured on the reference set, whose mix was never production's (Lesson I), so the "drift" was there on day one.`,
  application:`The monitoring plan for the reviewer is written before release (Cards page, in the report template): which proportions are watched, per stratum, against which baseline; the minimum meaningful shift that raises an alarm; the random labelled sample rate; and the rule for when an alarm becomes a frozen-set evaluation of a retrained candidate — which then goes back to Lesson F, on the same reference set, like any other release.

What an alarm produces in the meantime is a **diagnosis record** (Cards page), and it is the same discipline whether the difference arrived between two releases or between two weeks. The new camera is a hunch, not a finding, until a check has been run whose outcome would have come out differently had the macro month been the cause: the Keeper rate on the old body, week by week, is such a check, and "the rate fell in the week the camera arrived" is not, because it fits the mood and the macro month equally well. The record carries the assumptions the ruling rests on and whether it survives their alternatives, and it is allowed to end in **unexplained** — which is a finding about the monitoring, and cheaper than retraining on a cause nobody established (rule 10).`,
  diagnostic:{ q:`After the alarm, the team proposes retraining the reviewer on last month's frames "so it adapts to the new camera". What should be established first, and what evaluation does the retrained candidate face?`,
    a:`First, that within-stratum performance actually moved on a random labelled sample — otherwise there is nothing to adapt to, and retraining on a month of macro frames will shift the reviewer toward macro and degrade it elsewhere. If it did move, the retrained candidate faces the frozen reference set in a paired comparison (Lesson F) plus a new stratum for the new camera added as a new manifest version (Lesson K), never a comparison against last month's production numbers.` },
  exercise:`Choose one proportion you monitor. Compute its baseline standard error and the per-check α that keeps the yearly false-alarm rate under 10%. Stratify last month's value by the most likely nuisance cause and report whether the shift is in the mix or within strata. If you have no random labelled sample, write down what that means for every conclusion above.`,
  calc:{ inputs:[["p0","Baseline rate",0.12,0.001,0.999,0.001],["n","Rows this period",400,1,1e9,1],["k","Events this period",28,0,1e9,1],["checks","Checks per year",52,1,1e4,1],["alpha","Per-check α",0.05,0.0001,0.5,0.0001]],
    compute:(v)=>{ const p=v.k/v.n, se=Math.sqrt(v.p0*(1-v.p0)/v.n), z=(p-v.p0)/se; return {p,se,z,pval:2*(1-S.Phi(Math.abs(z))),famAlarm:1-Math.pow(1-v.alpha,v.checks),bonf:v.alpha/v.checks,mde:1.96*se}; },
    outputs:[["p","observed rate",3],["se","SE under baseline",4],["z","z",2],["pval","two-sided p",3],["famAlarm","P(≥1 false alarm per year)",2],["bonf","per-check α for family α",4],["mde","smallest 'significant' shift",3]],
    expect:{p:0.070,se:0.0162,z:-3.08,pval:0.002,famAlarm:0.93},
    note:"Try 40,000 rows a week and watch the smallest significant shift become meaningless." } }
];

const GLOSSARY = [
  ["Standard error","The standard deviation of a metric's sampling distribution: how much the number would move between re-draws of the same size. Lesson A."],
  ["Confidence interval","The output of a procedure that captures the true value a stated fraction of the time over repeated samples. Wilson for proportions by default. Lesson B."],
  ["Wilson interval","A proportion interval obtained by inverting the z-test; behaves at small n and near 0 and 1, unlike the Wald interval. Lesson B."],
  ["Bootstrap","Resampling the data with replacement to obtain the sampling distribution of any metric; honest only when the resampled unit is the independent unit. Lessons C, G."],
  ["Permutation test","A test that reshuffles labels under the null of exchangeability and asks how often the observed statistic recurs. Lesson G."],
  ["Effect size","How big a difference is, on a scale that a decision can use: absolute, relative, Cohen's h, or operational units. Lesson D."],
  ["Minimum meaningful effect","The smallest change that would alter a decision, written before the data are seen. Lessons D, L."],
  ["Power","The probability that a test detects an effect of a stated size; computed in advance for the minimum meaningful effect. Lesson E."],
  ["Paired comparison","Two systems scored on the same rows; the evidence lives in the discordant rows. McNemar's test. Lesson F."],
  ["Micro and macro averaging","Weighting an aggregate by rows or by classes; neither is the cost-weighted aggregate a decision needs. Lesson H."],
  ["Simpson's paradox","A ranking that holds in every stratum and reverses when pooled, because the pooled figures weight strata differently. Lesson H."],
  ["Post-stratification","Reweighting per-stratum estimates to a target population mix; corrects mix, not within-stratum bias. Lesson I."],
  ["Intra-cluster correlation","How much rows within a cluster resemble one another; drives the design effect. Lesson J."],
  ["Design effect","The factor by which clustering (or weighting) inflates the variance relative to independent sampling; n over DEFF is the effective sample size. Lessons I, J."],
  ["Effective sample size","The number of independent rows carrying the same information as the clustered sample. Lesson J."],
  ["Composition change","A change in the reference set's rows between two runs, which confounds any comparison across it. Lesson K."],
  ["Cohen's κ","Agreement between annotators corrected for chance; a ceiling on measurable system agreement with either. Lesson K."],
  ["Calibration","Among rows given confidence c, a fraction c are correct. Tested with a binned table; summarised by ECE. Lesson M."],
  ["Selective prediction","Acting automatically only above a confidence threshold; judged by the accuracy–coverage curve. Lesson M."],
  ["Covariate shift","The input mix changed; within-stratum behaviour did not. Lesson N."],
  ["Concept drift","The relationship between inputs and ground truth changed. Lesson N."],
  ["Unit of inference","The level a conclusion is about: row, document, project, or period. Intervals must be computed at that level. Lessons G, J."],
  ["Discriminating check","A check whose outcome differs depending on which explanation is true, as against one the favoured explanation is merely consistent with. What turns a hunch about a cause into a finding. Lesson N."]
];

const S = (() => {
  const erf = (x) => { // Abramowitz–Stegun 7.1.26, |error| < 1.5e-7
    const s = x < 0 ? -1 : 1; x = Math.abs(x); const t = 1/(1+0.3275911*x);
    const y = 1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
    return s*y; };
  const Phi = (z) => 0.5*(1+erf(z/Math.SQRT2));
  const zq = (p) => { let lo=-10, hi=10; for(let i=0;i<100;i++){ const m=(lo+hi)/2; if(Phi(m)<p) lo=m; else hi=m; } return (lo+hi)/2; };
  const seProp = (p,n) => Math.sqrt(p*(1-p)/n);
  const wald = (k,n,z) => { const p=k/n, h=z*seProp(p,n); return [p-h,p+h]; };
  const wilson = (k,n,z) => { const p=k/n, d=1+z*z/n, c=(p+z*z/(2*n))/d, h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d; return [c-h,c+h]; };
  const logChoose = (n,k) => { let s=0; for(let i=1;i<=k;i++) s+=Math.log(n-k+i)-Math.log(i); return s; };
  const binomCdf = (k,n,p) => { if(p<=0) return 1; if(p>=1) return k>=n?1:0; let s=0; for(let i=0;i<=k;i++) s+=Math.exp(logChoose(n,i)+i*Math.log(p)+(n-i)*Math.log(1-p)); return Math.min(1,s); };
  const clopper = (k,n,a) => {
    const solve = (f) => { let lo=0, hi=1; for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(f(m)) lo=m; else hi=m; } return (lo+hi)/2; };
    const L = k===0 ? 0 : solve(p => 1-binomCdf(k-1,n,p) < a/2);
    const U = k===n ? 1 : solve(p => binomCdf(k,n,p) > a/2);
    return [L,U]; };
  const binomTwoSided = (k,m) => { if(!m) return 1; const tail=1-binomCdf(k-1,m,0.5); return Math.min(1,2*tail); };
  const power2p = (p1,p2,n,alpha) => { const pb=(p1+p2)/2, se0=Math.sqrt(2*pb*(1-pb)/n), se1=Math.sqrt(p1*(1-p1)/n+p2*(1-p2)/n), za=zq(1-alpha/2), d=Math.abs(p1-p2);
    return 1-Phi((za*se0-d)/se1)+Phi((-za*se0-d)/se1); };
  const nForPower = (p1,p2,alpha,target) => { if(Math.abs(p1-p2)<1e-9) return Infinity; let lo=2, hi=2; while(power2p(p1,p2,hi,alpha)<target){ hi*=2; if(hi>1e9) return Infinity; }
    while(hi-lo>1){ const m=Math.floor((lo+hi)/2); if(power2p(p1,p2,m,alpha)<target) lo=m; else hi=m; } return hi; };
  const rng = (seed) => { let a = seed>>>0; return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }; // mulberry32
  const sum = (xs) => xs.reduce((a,b)=>a+b,0);
  const mean = (xs) => sum(xs)/xs.length;
  const pct = (xs,q) => { const s=[...xs].sort((a,b)=>a-b); const i=(s.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo); };
  const bootstrapCounts = (counts,B,seed,fn) => { // multinomial resample of a small contingency table
    const n=sum(counts), r=rng(seed), cum=[]; let acc=0; counts.forEach(c=>{acc+=c/n;cum.push(acc);});
    const out={}; for(let b=0;b<B;b++){ const c=counts.map(()=>0); for(let i=0;i<n;i++){ const u=r(); let j=0; while(u>cum[j]&&j<c.length-1) j++; c[j]++; }
      const v=fn(c); for(const k in v){ (out[k]=out[k]||[]).push(v[k]); } }
    const res={}; for(const k in out){ const xs=out[k].filter(x=>!isNaN(x)); res[k]=[pct(xs,0.025),pct(xs,0.975)]; } return res; };
  const bootstrapMean = (d,B,seed) => { const r=rng(seed), m=d.length, ms=[]; for(let b=0;b<B;b++){ let s=0; for(let i=0;i<m;i++) s+=d[Math.floor(r()*m)]; ms.push(s/m); } return [pct(ms,0.025),pct(ms,0.975)]; };
  const signFlipP = (d,seed) => { const m=d.length, obs=Math.abs(mean(d)); const eps=1e-12;
    if(m<=16){ let hit=0, total=1<<m; for(let mask=0;mask<total;mask++){ let s=0; for(let i=0;i<m;i++) s+=(mask>>i&1)?-d[i]:d[i]; if(Math.abs(s/m)>=obs-eps) hit++; } return hit/total; }
    const r=rng(seed), B=20000; let hit=0; for(let b=0;b<B;b++){ let s=0; for(let i=0;i<m;i++) s+=r()<0.5?-d[i]:d[i]; if(Math.abs(s/m)>=obs-eps) hit++; } return hit/B; };
  const parseList = (s) => String(s).split(/[,\s]+/).map(Number).filter(x=>!isNaN(x));
  return {erf,Phi,zq,seProp,wald,wilson,clopper,binomTwoSided,power2p,nForPower,rng,sum,mean,pct,bootstrapCounts,bootstrapMean,signFlipP,parseList};
})();

const fmt = (x,d) => { if(typeof x!=="number"||isNaN(x)) return "—"; if(!isFinite(x)) return "∞"; return d===0 ? String(Math.round(x)) : x.toFixed(d); };
const tickN = (x) => (typeof x!=="number"||!isFinite(x)) ? "—" : String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,","); // whole numbers with thousands separators, for figure labels

const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = (s) => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
const md = (text) => {
  const blocks = String(text).trim().split(/\n\s*\n/); let html = "";
  for (const b of blocks) {
    const lines = b.split("\n");
    if (lines.every(l => l.startsWith("| "))) {
      const rows = lines.map(l => l.replace(/^\|\s*/,"").replace(/\s*\|?$/,"").split(/\s*\|\s*/));
      html += "<table><thead><tr>" + rows[0].map(c=>"<th>"+inline(c)+"</th>").join("") + "</tr></thead><tbody>" +
        rows.slice(1).map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("") + "</tbody></table>";
    } else if (lines.every(l => l.startsWith("- "))) {
      html += "<ul>" + lines.map(l=>"<li>"+inline(l.slice(2))+"</li>").join("") + "</ul>";
    } else if (lines.every(l => l.startsWith("> "))) {
      html += "<div class=\"rule\">" + inline(lines.map(l=>l.slice(2)).join(" ")) + "</div>";
    } else {
      html += "<p>" + inline(lines.join(" ")) + "</p>";
    }
  }
  return html;
};

/* Figures. A lesson declares its figure as a small spec built from the
   calculator's inputs and outputs; FIG turns the spec into inline SVG as a
   string, so the check can render every figure without a DOM and the page
   can redraw one whenever an input changes. Eight kinds, all 640 units
   wide: grid (rows as squares, flat or in blocks), intervals (bars on one
   axis, with bands and marks), curves (sampling distributions), bars (with
   optional mosaic widths), hist, xy (points and lines), steps (boxes and
   arrows) and nest (boxes inside boxes). Colour is by class: f1 and f2 are
   the two runs (blue, orange), f3 a third category, f0 the neutral
   majority, fx a darker neutral, and ok / warn / bad the site's status
   colours; every class is named on the figure, so nothing is carried by
   colour alone. A spec whose numbers are not finite does not draw, and the
   page says so in place of the picture. */
const FIG = (() => {
  const W = 640;
  const nf = (x) => (isFinite(x) ? x : NaN).toFixed(1);
  const tw = (s,size) => String(s).length*(size||6.2); // estimated text width, for laying labels out
  const txt = (x,y,s,cls,anchor) => `<text x="${nf(x)}" y="${nf(y)}"${cls?` class="${cls}"`:""}${anchor?` text-anchor="${anchor}"`:""}>${esc(s)}</text>`;
  const tick = (x) => { if (!isFinite(x)) return "—"; const a=Math.abs(x); if (a>=1000) return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,","); if (a>=10) return String(Math.round(x*10)/10); return String(Math.round(x*1000)/1000); };
  const niceTicks = (min,max,n) => { const span=max-min; if(!(span>0)) return [min]; const raw=span/(n||6), p=Math.pow(10,Math.floor(Math.log10(raw))); const step=[1,2,5,10].map(m=>m*p).find(s=>s>=raw)||p*10;
    const out=[]; for(let t=Math.ceil(min/step-1e-9)*step; t<=max+1e-9; t+=step) out.push(Math.round(t/step)*step); return out; };
  const scale = (min,max,a,b) => (x) => a + (x-min)/(max-min)*(b-a);
  // an x axis with ticks; mark labels sit under the tick labels and the axis title under those
  const axis = (sx,min,max,y,ticks,label,markLabels) => { const ts=ticks||niceTicks(min,max); let s=`<line x1="${nf(sx(min))}" y1="${nf(y)}" x2="${nf(sx(max))}" y2="${nf(y)}" class="ax"/>`;
    ts.forEach(t=>{ if(t<min-1e-9||t>max+1e-9) return; s+=`<line x1="${nf(sx(t))}" y1="${nf(y)}" x2="${nf(sx(t))}" y2="${nf(y+5)}" class="ax"/>`+txt(sx(t),y+18,tick(t),"sm mute","middle"); });
    let yy=y+18; if(markLabels&&markLabels.length){ yy+=16; markLabels.forEach(m=>{ const x=Math.max(20,Math.min(W-20,sx(m.x))); const anchor = x<20+tw(m.label)/2 ? "start" : x>W-20-tw(m.label)/2 ? "end" : "middle"; s+=txt(x,yy,m.label,"sm mute",anchor); }); }
    if(label){ yy+=17; s+=txt((sx(min)+sx(max))/2,yy,label,"mute","middle"); } return {s,bottom:yy+6}; };
  // a legend that wraps; returns the markup and the height it used
  const legend = (items,x,y,right) => { let s="", cx=x, cy=y, rows=1; const widths=items.map(it=>15+tw(it.label)+16);
    if(right){ const total=widths.reduce((a,b)=>a+b,0)-16; cx=Math.max(20,right-total); }
    items.forEach((it,i)=>{ if(cx+widths[i]-16>W-20&&cx>x){ cx=x; cy+=17; rows++; } s+=`<rect x="${nf(cx)}" y="${nf(cy-9)}" width="11" height="11" rx="2" class="${it.cls}"/>`+txt(cx+15,cy,it.label,"sm"); cx+=widths[i]; });
    return {s,h:rows*17}; };
  const svg = (h,body,alt) => `<svg viewBox="0 0 ${W} ${Math.ceil(h)}" role="img" aria-label="${esc(alt||"figure")}">${body}</svg>`;
  const clampTo = (min,max) => (x) => Math.max(min,Math.min(max,x));

  const kinds = {
    intervals(p,alt){ const padL=170, padR=24; const bands=p.bands||[], marks=p.marks||[]; const top=bands.length?46:16;
      const sx=scale(p.min,p.max,padL,W-padR), cl=clampTo(p.min,p.max); let s="", y=top; const rowY=[]; p.rows.forEach(r=>{ const rh=r.dots?46:34; rowY.push(y+rh/2); y+=rh; }); const axY=y+6;
      bands.forEach((b,i)=>{ const a=sx(cl(b.from)), c=sx(cl(b.to)); s+=`<rect x="${nf(a)}" y="${top-4}" width="${nf(Math.max(0,c-a))}" height="${nf(axY-top+2)}" class="band ${b.cls}"/>`;
        if(b.label){ const mid=(a+c)/2, w=tw(b.label); const anchor = mid-w/2<padL-40 ? "start" : mid+w/2>W-padR ? "end" : "middle"; const lx = anchor==="start" ? Math.max(a,padL-40) : anchor==="end" ? Math.min(c,W-padR) : mid; s+=txt(lx,top-(i%2?26:12),b.label,"sm mute",anchor); } });
      marks.forEach(m=>{ const x=sx(cl(m.x)); s+=`<line x1="${nf(x)}" y1="${top-4}" x2="${nf(x)}" y2="${nf(axY)}" class="mark ${m.cls||""}"/>`; });
      p.rows.forEach((r,i)=>{ const cy=rowY[i], cls=r.cls||"f1"; s+=txt(padL-12,cy+4,r.label,"","end");
        if(r.dots){ const seen=[]; r.dots.forEach(d=>{ const x=sx(cl(d)); let k=0; seen.forEach(q=>{ if(Math.abs(q.x-x)<6) k=Math.max(k,q.k+1); }); seen.push({x,k}); const off=[0,-9,9,-18,18][Math.min(k,4)]; s+=`<circle cx="${nf(x)}" cy="${nf(cy+off)}" r="5" class="dot ${cls}"/>`; }); }
        if(typeof r.lo==="number"&&typeof r.hi==="number"){ const a=sx(cl(r.lo)), b=sx(cl(r.hi)); s+=`<rect x="${nf(a)}" y="${nf(cy-5)}" width="${nf(Math.max(2,b-a))}" height="10" rx="4" class="${cls}"/>`; }
        if(typeof r.x==="number") s+=`<circle cx="${nf(sx(cl(r.x)))}" cy="${nf(cy)}" r="5.5" class="pt ${cls}"/>`; });
      const ax=axis(sx,p.min,p.max,axY,p.ticks,p.xlabel,marks.filter(m=>m.label).map(m=>({x:cl(m.x),label:m.label}))); s+=ax.s; return svg(ax.bottom,s,alt); },

    curves(p,alt){ const padL=24, padR=24, top=56, base=200; const sx=scale(p.min,p.max,padL,W-padR);
      const pdf=(c,x)=>Math.exp(-0.5*((x-c.mu)/c.sd)**2)/c.sd; const peak=Math.max(...p.curves.map(c=>1/c.sd)); const sy=(v)=>base-(v/peak)*(base-top);
      const N=160, xs=[]; for(let i=0;i<=N;i++) xs.push(p.min+(p.max-p.min)*i/N); let s="";
      p.curves.forEach(c=>{ const pts=xs.map(x=>`${nf(sx(x))},${nf(sy(pdf(c,x)))}`); s+=`<path d="M${nf(sx(p.min))},${nf(base)} L${pts.join(" L")} L${nf(sx(p.max))},${nf(base)} Z" class="area ${c.cls}"/><path d="M${pts.join(" L")}" class="line ${c.cls}"/>`;

      const ax=axis(sx,p.min,p.max,base,p.ticks,p.xlabel,marks.filter(m=>m.label).map(m=>({x:Math.max(p.min,Math.min(p.max,m.x)),label:m.label}))); s+=ax.s;

const PARTS = [["question","Engineering question"],["principle","Core statistical principle"],["maths","Essential mathematics"],["assumptions","Assumptions"],["example","Worked example (synthetic)"],["pitfall","Common interpretation error"],["application","Application to the case"],["diagnostic","One diagnostic question"],["exercise","One applied exercise"]];

    reading(){ return `<h2>Further reading</h2><p>The lessons derive everything they use, so none of this is required. These are the sources behind the methods, for when a derivation is not enough, in roughly the order the lessons meet them. Nothing here is about the fictional case.</p><ol>${READING.map(r=>`<li><p>${esc(r.cite)}<br><span class="mute">${inline(r.why)} Lessons ${r.lessons.map(id=>`<a href="#/lesson/${id}">${id}</a>`).join(", ")}.</span></p></li>`).join("")}</ol>`; },
    session(){ const saved=store.get("session",{});
      return `<h2>End-of-session note</h2><p>Every lesson ends with the same five lines. Fill them, copy the note out, keep it with the evaluation it came from.</p><div class="session">${SESSION_FIELDS.map(f=>`<label for="s-${f[0]}">${esc(f[1])} <span class="mute">— ${esc(f[2])}</span></label><textarea id="s-${f[0]}" data-key="${f[0]}">${esc(saved[f[0]]||"")}</textarea>`).join("")}<p><button type="button" id="s-build">Build the note</button> <button type="button" id="s-clear">Clear</button></p><pre id="s-out" aria-live="polite"></pre></div>`; },
    lesson(id){ const l=LESSONS.find(x=>x.id===id); if(!l) return views.home();
      const parts = PARTS.map((p,i)=>{ const key=p[0]; let body;
        if(key==="diagnostic") body = md(l.diagnostic.q)+`<p><button type="button" class="reveal-btn" aria-expanded="false" aria-controls="ans-${l.id}">Show an answer</button></p><div class="reveal" id="ans-${l.id}" hidden>${md(l.diagnostic.a)}</div>`;
        else if(key==="example") body = md(l.example)+lessonFig(l, calcDefaults(l.calc), false)+renderCalc(l);
        else body = md(l[key]);
        return `<section id="part-${i+1}"><h3>${i+1}. ${esc(p[1])}</h3>${body}</section>`; }).join("");
      const ex = EXAMS[l.id] || []; const rec = examRecord(l.id);
      const exam = `<section id="part-10" class="exam"><h3>10. Exam</h3><p class="mute">${ex.length} questions, one answer each. Mark it as often as you like; the lessons page keeps your best score.${rec.attempts?` Best so far: ${rec.best} of ${ex.length} in ${rec.attempts} attempt${rec.attempts===1?"":"s"}.`:""}</p><form id="exam-form"><ol>${ex.map((x,i)=>`<li data-q="${i}"><div class="q">${inline(x.q)}</div>${x.o.map((opt,j)=>`<label><input type="radio" name="q${i}" value="${j}">${inline(opt)}</label>`).join("")}<div class="why" hidden></div></li>`).join("")}</ol><button type="submit" class="mark">Mark the exam</button> <span class="score" id="exam-score" aria-live="polite"></span></form></section>`;
      const gentle = track()==="gentle" && l.gentle ? `<section id="part-0" class="gentle"><h3>In plain words, first</h3>${md(l.gentle)}${lessonFig(l, calcDefaults(l.calc), true)}<p class="mute">Then the nine parts, which say the same thing exactly; the picture is there too, and it moves when the calculator does.</p></section>` : "";
      return `<p class="mute">Lesson ${l.id} · ${LESSONS.indexOf(l)+1} of ${LESSONS.length}</p><h2>${l.id}. ${esc(l.title)}</h2>${trackLine(l)}${gentle}<ul class="parts">${PARTS.map((p,i)=>`<li><a href="#/lesson/${l.id}#part-${i+1}">${i+1}. ${esc(p[1])}</a></li>`).join("")}<li><a href="#/lesson/${l.id}#part-10">10. Exam</a></li></ul>${parts}${exam}<p><button type="button" id="mark-done">Mark this lesson read</button> <span class="mute" id="done-msg"></span></p>${nav(l)}`; }
  };

  const route = () => {
    const h = location.hash.replace(/^#\/?/,""); const [path, frag] = h.split("#"); const seg = path.split("/");
    let html;
    if (seg[0]==="lesson" && seg[1]) html = views.lesson(seg[1].toUpperCase());
    else if (views[seg[0]] && seg[0]!=="lesson") html = views[seg[0]]();
    else html = views.home();
    main.innerHTML = html;
    document.title = (seg[0]==="lesson" ? `Lesson ${seg[1].toUpperCase()} — ` : "") + SITE.title;
    main.querySelectorAll(".calc").forEach(el => { runCalc(el); el.addEventListener("input", () => runCalc(el)); });
    main.querySelectorAll(".reveal-btn").forEach(b => b.addEventListener("click", () => { const t=document.getElementById(b.getAttribute("aria-controls")); t.hidden=!t.hidden; b.setAttribute("aria-expanded", String(!t.hidden)); b.textContent = t.hidden ? "Show an answer" : "Hide the answer"; }));
    const ef = main.querySelector("#exam-form"); if (ef) ef.addEventListener("submit", (e) => { e.preventDefault(); const id=seg[1].toUpperCase(), ex=EXAMS[id]||[]; let score=0;
      ex.forEach((x,i)=>{ const li=ef.querySelector(`li[data-q="${i}"]`), picked=ef.querySelector(`input[name="q${i}"]:checked`); const ok=picked&&Number(picked.value)===x.a; if(ok) score++;
        li.classList.remove("right","wrong"); li.classList.add(ok?"right":"wrong"); const w=li.querySelector(".why"); w.hidden=false; w.innerHTML=(ok?"<b>Right.</b> ":picked?`<b>Not this one.</b> The answer is "${inline(x.o[x.a])}". `:`<b>Unanswered.</b> The answer is "${inline(x.o[x.a])}". `)+inline(x.why); });
      const all=store.get("exams",{}); const prev=all[id]||{best:0,attempts:0}; all[id]={best:Math.max(prev.best,score),attempts:prev.attempts+1,last:score}; store.set("exams",all);
      document.getElementById("exam-score").textContent=`${score} of ${ex.length}${score>=passMark(id)?" — passed":""}. Best: ${all[id].best} of ${ex.length}.`; });
    const sf = main.querySelector("#start-form"); if (sf) sf.addEventListener("submit", (e) => { e.preventDefault(); const c=CALIBRATION; let score=0;
      c.questions.forEach((x,i)=>{ const p=sf.querySelector(`input[name="q${i}"]:checked`); if(p&&Number(p.value)===x.a) score++; });
      const sp=sf.querySelector('input[name="self"]:checked'); const wordsFirst = !!sp && Number(sp.value)>=c.self.gentleAt;
      const gentle = score < c.passAt || wordsFirst; store.set("calib",{score,wordsFirst,when:Date.now()});
      const rec=document.getElementById("start-rec"); rec.hidden=false;
      rec.innerHTML = `<p>${score} of ${c.questions.length}${wordsFirst?", and words first":""}.</p>${md(gentle?c.verdict.gentle:c.verdict.standard)}<button type="button" class="track-btn" data-track="${gentle?"gentle":"standard"}">Take the ${gentle?"gentle":"standard"} track</button><button type="button" class="track-btn" data-track="${gentle?"standard":"gentle"}">Take the ${gentle?"standard":"gentle"} track instead</button>`;
      wireTrack(); rec.scrollIntoView(); });
    const wireTrack = () => main.querySelectorAll(".track-btn").forEach(b => b.addEventListener("click", () => { store.set("track", b.dataset.track); location.hash = "#/"; }));
    wireTrack();
    const tt = main.querySelector(".track-toggle"); if (tt) tt.addEventListener("click", (e) => { e.preventDefault(); store.set("track", track()==="gentle"?"standard":"gentle"); route(); });
    const md_ = main.querySelector("#mark-done"); if (md_) md_.addEventListener("click", () => { const d=doneSet(); d.add(seg[1].toUpperCase()); store.set("done",[...d]); document.getElementById("done-msg").textContent="Marked."; });
    const sb = main.querySelector("#s-build"); if (sb) {
      const fields = () => { const o={}; main.querySelectorAll("textarea").forEach(t=>o[t.dataset.key]=t.value); return o; };
      main.querySelectorAll("textarea").forEach(t => t.addEventListener("input", () => store.set("session", fields())));
      sb.addEventListener("click", () => { const f=fields(); document.getElementById("s-out").textContent = SESSION_FIELDS.map(x=>`${x[1]}: ${f[x[0]]||"—"}`).join("\n"); });
      main.querySelector("#s-clear").addEventListener("click", () => { main.querySelectorAll("textarea").forEach(t=>t.value=""); store.set("session",{}); document.getElementById("s-out").textContent=""; });
    }
    if (frag) { const t=document.getElementById(frag); if(t) t.scrollIntoView(); } else window.scrollTo(0,0);
    main.focus({preventScroll:true});
  };
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
