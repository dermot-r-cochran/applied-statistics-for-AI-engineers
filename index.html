<footer>One file, no dependencies, no network. Every worked example is synthetic and labelled as such; one companion dataset, Reference Set 2, is real and says so. Text CC BY 4.0, engine MIT. <a href="https://github.com/dermot-r-cochran/applied-statistics-for-AI-engineers">Source</a>.</footer>
<script>
/* =====================================================================
   WORLD DATA
   Everything a reader meets lives here, as plain literals: the running
   example, the reasoning rules, the fourteen lessons, the reference
   cards and the glossary. The engine below renders them and never needs
   editing to add a lesson. Prose uses a small markup: blank line between
   paragraphs, `code`, **bold**, "- " for list items, "| " rows for a
   table (first row is the header), "> " for a rule box. Each lesson also
   carries a `figure`: a title, a caption in words for the gentle page, a
   caption for the standard track, and `draw(v, r)`, which turns the
   calculator's inputs and outputs into a small figure spec that the engine
   draws as SVG (the kinds are listed above FIG in the engine). The figure
   is the worked example as a picture, so its numbers are the calculator's.
   ===================================================================== */

const SITE = {
  title: "Applied Statistics for AI Engineers",
  tagline: "Evaluation metrics and confidence intervals for people who ship AI systems.",
  intro: `This is a course in applied statistics, not in any AI framework. It reactivates the statistics you already met and connects each idea to one recurring engineering question: **is what I am seeing a real change in the system, or something else** — sampling variation, sampling bias, measurement error, a change in the test set, a change in the class mix, drift, or an aggregation that hides the story?

It assumes you have met probability and statistics before and have shipped or evaluated models. Foundations are reactivated, not taught from zero; every formula is derived far enough that you could re-derive it; every assumption is stated; and every worked example is synthetic and says so. **The case** also names a real companion dataset, Reference Set 2, kept apart from the lessons' own numbers so the two are never confused.

The examples follow one fictional system throughout, described under **The case**: an AI reviewer of photographic contact sheets whose verdicts are scored against the photographer's own decisions. It was chosen because a contact sheet has exactly the structure that makes evaluation statistics hard — rows inside documents inside projects, rare positive classes, judges who disagree — and because the domain is ordinary enough that nothing in it distracts from the statistics. A second, smaller example, an AI reader of short-story drafts, appears where text similarity and disagreeing judges need it. Neither system exists.

Fourteen lessons, each in the same nine parts: the engineering question, the principle, the mathematics, the assumptions, a worked synthetic example with a live calculator, the common misreading, the application to the case, one diagnostic question and one exercise, then a four-question exam marked on the page. Read them in order the first time; each leans on the last. Your best exam score per lesson and a scorecard for the course sit below; the **Session note** page builds the five-line closing note the lessons ask for.`,
  howToRead: `Each lesson's calculator is seeded with the worked example, so the numbers in the text are the numbers on screen; change an input and the text's claim can be re-tested. Progress is kept in this browser only.`
};

const CASE = {
  name: "Project Frog",
  summary: `**Project Frog** is the codename of a fictional AI system that reviews a photographer's contact sheets. The name means nothing; it is a codename, the way real internal projects have codenames, and the system does not exist. Everything measured about it in these lessons is synthetic.`,
  body: `**What the system does.** Given a contact sheet — every frame from one outing's memory card — the reviewer emits one row per frame, with these fields:

| Field | Kind | Scored how |
| \`frame\` | structural identifier | exact match against the sheet's frame numbers; a row whose frame does not exist is an *invented* row, a frame with no row is a *missed* row |
| \`verdict\` | categorical: **Keeper**, **Near miss**, **Folder**, **Barred** | categorical correctness against the photographer's verdict |
| \`category\` | categorical: Wildlife, Nature, Documentary, Macro, Landscape | categorical correctness |
| \`note\` | natural-language recommendation ("crop the left third", "heal the dust spot at top right") | text similarity to the photographer's own note; judged usefulness on a 0–2 scale |
| \`reason\` | justification for the verdict | judged support on a 0–2 scale |
| \`evidence\` | what in the frame the reason points at (a region, an exposure fact) | evidence quality 0–2: does it actually show what the reason claims |
| \`relations\` | links to other rows: burst sibling of, duplicate of, better than | precision and recall over the photographer's links |

**Ground truth** is the photographer's own decision for every frame — which went to the published set, which to the folder, which could never be published (a recognisable person, a mating pair) — plus their notes and links. It is a measurement, not an oracle: on a subset a club judge annotates the same sheets independently, and the two disagree on a known fraction of verdicts. That fraction is measurement error, and several lessons use it.

**Structure.** A row is a frame. A document is a contact sheet (one outing, typically 8–25 frames after a first cull). A project is a trip or a season (many outings). A scenario is a kind of shooting — safari, home ground, macro, an air show — with its own light, subjects and keeper rate. The dataset is a versioned reference set; the lessons use **Reference Set 1**: 500 frames from 40 outings across 6 projects, keeper rate about 16%, frozen with its ground truth on a stated date.

**Metrics** that appear: exact match (frames, relations), categorical correctness (verdict, category), accuracy, precision, recall, F1 and F-beta on the Keeper and Barred classes, pass rate (a sheet *passes* if every Barred frame was caught), text similarity of notes, evidence quality, unmatched-row counts (missed and invented), and processing time per sheet.

**Aggregation** happens at every level and each level asks a different question: by cell (one field of one row), by column (all verdicts), by row (the whole frame right or wrong), by verdict class, by document (the sheet passed?), by project (how did the safari go?), by scenario, and over the whole reference set. Most of the traps in this course are about moving between these levels without noticing.

**Why this example.** Frames from one outing share light, subject and the photographer's mood, so rows are clustered, not independent. Keepers are rare, so accuracy flatters. Barred frames are rarer still and matter most, so class weighting is not academic. Two annotators disagree, so ground truth has error bars of its own. A new camera body changes the frames without changing the reviewer, so drift and composition change are natural. And nothing about it needs domain knowledge beyond what a hobbyist has.

**The second example.** Where text is the output — the \`note\` and \`reason\` fields, and the whole of a fictional AI that reads short-story drafts and returns editorial notes — the lessons say what a similarity score does and does not measure, and how much two competent editors disagree. That example is smaller and appears only where it is needed.

**Reference Set 2, added 2026-09-21.** Everywhere above, "synthetic" means the whole
measurement: a fictional reviewer scored against fictional ground truth. Reference Set 2
breaks that in one place only. It is real: 12,713 frames from 33 real outings, shot
2023–2026, each with the camera's real exposure settings and a real sharpness score
(the variance of the Laplacian on a quarter-scale grey decode — a focus proxy, not a
quality judgment). Ground truth is real too: 41 frames the photographer actually kept
— published to his site or promoted to a competition-masters folder, a positive rate of
0.32%. **There is still no reviewer.** Nothing in this dataset was scored by an AI system,
real or fictional; Reference Set 2 is ground truth without a subject, offered so a reader
can compute real numbers instead of trusting the lessons' worked examples on faith. It sits
outside every lesson's \`expect\`-checked example, which stay Reference-Set-1 synthetic as
before, so the two never collide. \`data/reference-set-2.csv\` in the repository has every
row: outing, frame, ISO, shutter speed, focal length, aperture, the sharpness and
brightness scores, and two ground-truth flags, \`published\` and \`master\`. Try Lesson H's
imbalance arithmetic on it, or Lesson C's precision/recall at a sharpness threshold of your
choosing, against real numbers rather than the lesson's own.`,
  figure:{ title:"How the rows nest",
    caption:`Reference Set 1 as the lessons see it: frames inside contact sheets inside projects, one row of reviewer output per frame. Each level is a place to aggregate, and a place to be wrong about independence.`,
    spec:{type:"nest",cells:8,levels:[{label:"Reference Set 1",sub:"500 frames, frozen with their ground truth on a stated date",cls:"f0"},{label:"6 projects",sub:"a trip or a season, many outings each",cls:"f0"},{label:"40 outings, one contact sheet each",sub:"8–25 frames each; one outing shares light, subject and mood",cls:"f1"},{label:"frames, one row of reviewer output each",sub:"frame, verdict, category, note, reason, evidence, relations",cls:"f2"}]} }
};

/* The start page: a few calibration questions, and the two tracks they
   choose between. Neither track changes a lesson's nine parts. The gentle
   track puts a plain-words page in front of each lesson first; the
   standard track goes straight to the nine parts. The reader may switch
   at any lesson, whatever the questions said. Added 2026-09-19 at
   Dermot's direction: a lighter, gentler optional introduction track
   based on a few calibration questions at the start. */
const CALIBRATION = {
  intro: `Four short questions and one about you. They take about three minutes and are not an exam: nothing is scored for keeps and nothing is hidden behind them. They only decide which of two tracks to suggest.

**Standard track.** Each lesson is its nine parts, expert to expert: the engineering question, the principle, the mathematics derived, the assumptions, a worked example with a live calculator, the common misreading, the application to the case, a diagnostic question and an exercise.

**Gentle track.** The same nine parts, but each lesson opens with a plain-words page first: what the question is in everyday terms, the one idea, the worked example told in words with the same numbers, an everyday version of it, and a picture of it. Then the nine parts, which say the same thing exactly. Nothing is left out of the gentle track; it just starts softer.

You can switch tracks at the top of any lesson.`,
  questions: [
    { q:"An evaluation run reports verdict accuracy 0.84 on 500 frames. Which reading is right?",
      o:["0.84 is the reviewer's accuracy","0.84 is one draw; another 500 frames from the same system would give a slightly different number","the number is exact, because 500 is a large sample"], a:1 },
    { q:"A 95% confidence interval for a rate is best read as:",
      o:["the true rate has a 95% chance of being inside this interval","a range from a method that captures the true rate in 95% of repeated samples","95% of the frames fall inside it"], a:1 },
    { q:"Keepers are 16% of frames. A reviewer that calls every frame 'not a keeper' has an accuracy of about:",
      o:["0.16","0.50","0.84"], a:2 },
    { q:"Two model versions were scored on the same 500 frames. The fairest comparison:",
      o:["treats them as two independent samples","compares them frame by frame, since every frame was seen by both","cannot be made without a third sample"], a:1 }
  ],
  self: { q:"And one about you. A line like SE = sqrt(p(1 - p) / n) is:",
          o:["fine; I read that kind of thing daily","something I can follow, slowly","something I would rather have in words first"], gentleAt:2 },
  passAt: 3,
  verdict: {
    gentle: `The suggestion is the **gentle track**: a plain-words page opens each lesson, then the nine parts. It is the same course; it starts softer. Switch at any lesson if it feels slow.`,
    standard: `The suggestion is the **standard track**: straight to the nine parts. The plain-words pages are still there on the gentle track if a lesson ever lands awkwardly; switch at the top of any lesson.`
  },
  figure:{ title:"Two tracks, one course",
    caption:`Five questions choose a suggestion; either track then reads the same nine parts and exam. The gentle track puts a plain-words page with a picture of the worked example in front of each lesson, and the switch at the top of any lesson moves between the two.`,
    spec:{type:"steps",rows:[{label:"start here",boxes:[{text:"five questions",sub:"about three minutes"},{text:"a suggestion",sub:"never a lock"}]},{label:"gentle track",boxes:[{text:"plain words first",sub:"idea, example, picture",cls:"ok"},{text:"the nine parts",sub:"the same, exactly"},{text:"the exam",sub:"four questions"}]},{label:"standard track",boxes:[{text:"the nine parts",sub:"expert to expert"},{text:"the exam",sub:"four questions"}]}]} }
};

const RULES = [
  ["A point estimate from its uncertainty", "0.84 is not a fact about the system; it is a fact about the system and this sample. Report the interval or the standard error with it, always."],
  ["A smaller sample from a biased sample", "A small sample is imprecise and the interval says so. A biased sample is wrong in a direction the interval cannot see. No amount of data fixes the second."],
  ["Statistical significance from practical significance", "A p-value says the difference is unlikely to be noise. It does not say the difference is worth anything. Decide the minimum meaningful effect before looking."],
  ["Row count from effective sample size", "A thousand frames from six outings carry far fewer than a thousand independent pieces of evidence. The design effect says how many."],
  ["Independent observations from clustered or repeated observations", "Rows inside a document share causes. Treat them as independent and every standard error is too small."],
  ["Model regression from test-set composition change", "If the reference set changed between runs, the metric changed for two reasons at once. Compare on the shared rows first."],
  ["Metric variance from metric-definition change", "A new similarity threshold or a re-adjudicated label moves the number without touching the system. Version the scorer as you version the model."],
  ["Association from causation", "Sheets with long notes score lower. That does not mean notes cause errors; hard sheets get long notes."],
  ["Exploratory analysis from confirmatory evaluation", "The slice you found by looking at forty slices is not evidence at the same strength as the one you named in advance."],
  ["A hunch from a finding", "Intuition is a direction for investigation, not the result of one. Name the rival explanations alongside yours, choose a check whose outcome differs between them, and confirm it on rows that did not suggest it. A cause that merely fits what you saw is not established: so do the others, and so does the assumption you made in order to see it."]
];

const LESSONS = [
{ id:"A", title:"Sampling distributions and standard error",
  gentle:`Two runs, two numbers: 0.84 for the last release and 0.81 for the candidate, both on 500 frames. Did it get worse?

**The one idea.** A score from 500 frames is like a count of heads from 500 coin tosses: run it again on another 500 frames from the same system and it comes out a little different. That wobble has a size, and the size is called the **standard error**. Nothing about the system changed to produce it; it is what sampling does.

**The example in words.** The release got 420 of 500 right, the candidate 405 of 500. The wobble on each score is about 0.017, and the wobble on the gap between them is about 0.024. The gap is 0.03, so it is about one and a quarter wobbles wide. Gaps that big appear between two draws of an unchanged system roughly one time in five.

**An everyday version.** Toss a fair coin 500 times and you will not get exactly 250 heads; 235 or 262 are ordinary. Two counts from the same coin differ, and nobody says the coin changed between them.

**So the answer is** not "it got worse" and not "nothing changed" either. It is "this evaluation cannot tell", which is a real answer and the honest one. The nine parts below show how to size the wobble for any score you have.`,
  figure:{ title:"What two draws from one unchanged system look like",
    gentle:`Each hump is the spread of scores that one unchanged system would give from 500 frames if the run were repeated: the release's hump is centred on its 0.84, the candidate's on its 0.81. The humps overlap almost entirely, and each observed score sits well inside the other's hump. That is what "the gap is about one and a quarter wobbles wide" looks like.`,
    caption:`Sampling distributions of \`p̂\` for the two runs, normal with mean \`p̂\` and standard deviation \`SE\`. The observed values are marked; the overlap is the picture of \`z = 1.25\`. Change the counts and the humps move and narrow with them.`,
    draw:(v,r)=>{ const w=4*Math.max(r.seA,r.seB); return {type:"curves",min:Math.min(r.pA,r.pB)-w,max:Math.max(r.pA,r.pB)+w,xlabel:`accuracy from ${v.nA} frames, if the run were repeated`,
      curves:[{mu:r.pA,sd:r.seA,label:"release",cls:"f1"},{mu:r.pB,sd:r.seB,label:"candidate",cls:"f2"}],
      marks:[{x:r.pA,label:`${fmt(r.pA,2)} observed`,cls:"f1"},{x:r.pB,label:`${fmt(r.pB,2)} observed`,cls:"f2"}]}; } },
  question:`Verdict accuracy on Reference Set 1 was **0.84** for the last release and is **0.81** for the candidate. Both runs used 500 frames. Did the candidate get worse, or is a three-point gap what two draws from the same system look like?`,
  principle:`A metric computed on a finite sample is a random variable. If the same system were scored on another 500 frames drawn the same way, the accuracy would differ. The distribution of the metric over such re-draws is its **sampling distribution**, and the standard deviation of that distribution is the **standard error** (SE). The standard error is the unit in which any observed difference must be measured before it means anything.`,
  maths:`For a binary outcome per row, \`X_i ∈ {0, 1}\` (verdict right or wrong), the accuracy is the mean \`p̂ = (1/n) Σ X_i\`. If rows are independent with the same success probability \`p\`, each \`X_i\` has variance \`p(1 − p)\`, so the mean has variance \`p(1 − p)/n\` and

\`SE(p̂) = √( p(1 − p) / n )\`

We do not know \`p\`, so we plug in \`p̂\`. For the difference of two independent estimates the variances add:

\`SE(p̂_A − p̂_B) = √( SE_A² + SE_B² )\`

By the central limit theorem the sampling distribution of \`p̂\` is close to normal once \`np̂\` and \`n(1 − p̂)\` are both above about 10, so about 95% of re-draws land within \`±1.96 SE\` of the truth. The observed difference divided by its standard error, \`z = (p̂_A − p̂_B)/SE_diff\`, says how many standard errors apart the two runs are.`,
  assumptions:`- Rows are independent, or nearly so. On contact sheets they are not (Lesson J), so this lesson's standard errors are a floor, not the truth.
- The same success probability applies to every row, or at least the mean of the row probabilities is what we care about.
- Ground truth and the metric definition did not change between the two runs (Lessons K and the rules).
- The two runs are on different draws if you use the independent formula. If they scored the *same* 500 frames, the rows are paired and Lesson F applies; the independent formula then overstates the standard error.`,
  example:`Synthetic. Release A: 420 of 500 verdicts correct, \`p̂_A = 0.84\`. Candidate B: 405 of 500, \`p̂_B = 0.81\`.

\`SE_A = √(0.84 × 0.16 / 500) = 0.0164\` and \`SE_B = √(0.81 × 0.19 / 500) = 0.0175\`.

The standard error of the difference is \`√(0.0164² + 0.0175²) = 0.0240\`. The observed gap of 0.03 is therefore \`z = 1.25\` standard errors — the kind of gap that appears between two draws from an unchanged system roughly one time in five. On this evidence alone the candidate has not been shown to be worse. It has not been shown to be the same either; the interval for the difference runs from about −0.017 to +0.077.`,
  pitfall:`Reading 0.84 and 0.81 as two facts and subtracting them. A number without its standard error is a coordinate without a scale. The mirror-image error is treating a "not significant" result as proof of no change: with 500 rows a side, a real three-point regression is invisible more often than not (Lesson E).`,
  application:`Report every reference-set metric with its standard error or interval, computed on the unit that is actually independent. When two runs differ, express the gap in standard errors before anyone reads it as a regression or an improvement. Where both runs scored the same frames — which they should — use the paired analysis of Lesson F instead; the answer changes.`,
  diagnostic:{ q:`The candidate's accuracy on the 60-frame safari slice is 0.90 against the release's 0.95. A colleague says a five-point drop on safari is clearly a regression because it is bigger than the three-point drop overall. What is the flaw in the reasoning?`,
    a:`The slice is one eighth the size, so its standard errors are about \`√8 ≈ 2.8\` times larger. \`SE\` for 0.95 on 60 rows is about 0.028 and for 0.90 about 0.039, so the five-point gap is about one standard error — weaker evidence than the overall three-point gap, not stronger. The reasoning compared point estimates across different sample sizes without scaling by their uncertainty.` },
  exercise:`Take the last two evaluation runs you have to hand. For the headline metric, compute the standard error of each and of their difference under the independence assumption, and state the gap in standard errors. Then write one sentence on why the true standard error is probably larger than what you computed.`,
  calc:{ inputs:[["kA","Release: correct rows",420,0,1e9,1],["nA","Release: rows",500,1,1e9,1],["kB","Candidate: correct rows",405,0,1e9,1],["nB","Candidate: rows",500,1,1e9,1]],
    compute:(v)=>{ const pA=v.kA/v.nA, pB=v.kB/v.nB, seA=S.seProp(pA,v.nA), seB=S.seProp(pB,v.nB), sed=Math.hypot(seA,seB); const d=pA-pB;
      return {pA,pB,seA,seB,sed,z:d/sed,lo:d-1.96*sed,hi:d+1.96*sed}; },
    outputs:[["pA","p̂ release",3],["pB","p̂ candidate",3],["seA","SE release",4],["seB","SE candidate",4],["sed","SE of difference",4],["z","gap in standard errors",2],["lo","difference, 95% low",3],["hi","difference, 95% high",3]],
    expect:{seA:0.0164,seB:0.0175,sed:0.0240,z:1.25},
    note:"Independent-draws formula. If both runs scored the same rows, Lesson F's paired calculator is the right one." } },

{ id:"B", title:"Estimation and confidence intervals",
  gentle:`Nine verdicts right out of ten. Someone wants to write "90% accurate" on the report.

**The one idea.** Ninety percent is what happened on those ten frames. The reviewer's true rate is unknown, and with ten frames a wide range of true rates could easily have produced 9 of 10. A **confidence interval** is that range, drawn by a method that captures the true value most of the time.

**The example in words.** With 9 of 10, the plausible true rates run from somewhere in the fifties up to nearly certain. Ten frames cannot narrow it further. The simplest way of drawing the range breaks down when the score is near 100%; two better ways behave, and the lesson shows all three so you can see the difference.

**An everyday version.** Ten reviews of a new café, nine of them good. That does not make it a nine-out-of-ten café; with only ten reviews it could easily be a six-out-of-ten café on a lucky week.

**So the answer is** to write the range, with the ten beside it, rather than the single number. The nine parts derive the three intervals and let you compare them on the calculator.`,
  figure:{ title:"Three intervals for 9 of 10",
    gentle:`Each bar is the range of true rates one method says is consistent with nine right out of ten; the dot is the plain 90%. The top bar runs past the edge into the shaded region, which is above 100% and cannot be a rate at all: that method has failed, not measured. The two lower bars behave, and they agree that anything from the mid-fifties to the high nineties fits the data.`,
    caption:`Wald, Wilson and Clopper–Pearson intervals at the chosen level, with \`p̂\` marked. The band above 1 is where Wald's interval runs when \`p̂\` is near the edge. Try 48 of 50 to see it again, and 405 of 500 to watch the three agree.`,
    draw:(v,r)=>{ const max=Math.max(1.06,r.waldHi+0.02), min=Math.max(0,Math.min(0.4,r.cpLo-0.05,r.waldLo-0.05)); return {type:"intervals",min,max,xlabel:"true accuracy consistent with the data",
      bands:[{from:1,to:max,cls:"bad",label:"above 100%: not a rate"}],
      rows:[{label:"Wald (normal)",lo:r.waldLo,hi:r.waldHi,x:r.p,cls:"f2"},{label:"Wilson",lo:r.wilsonLo,hi:r.wilsonHi,x:r.p,cls:"f1"},{label:"Clopper–Pearson (exact)",lo:r.cpLo,hi:r.cpHi,x:r.p,cls:"f1"}],
      marks:[{x:1,label:"100%"}]}; } },
  question:`A single contact sheet of 10 frames came back with 9 verdicts right. Someone wants to write "90% accurate" on the sheet's report. What range of true accuracies is consistent with 9 of 10, and which interval formula should produce it?`,
  principle:`A **confidence interval** is the output of a procedure that, over repeated samples, captures the true value a stated fraction of the time. The interval is a property of the procedure, not of this one sample: a 95% interval does not have a 95% chance of containing the truth; the procedure has a 95% success rate. Different procedures with the same nominal level can behave very differently at small \`n\` or near 0% and 100%, which is exactly where AI evaluation lives — rare classes, small slices, high accuracies.`,
  maths:`**Wald (normal approximation):** \`p̂ ± z √(p̂(1 − p̂)/n)\`. Simple, and wrong where it matters: at \`p̂ = 1\` its width is zero, and it can run past 1.

**Wilson:** invert the test instead of plugging in. Solve \`|p̂ − p| = z √(p(1 − p)/n)\` for \`p\`, which gives

\`centre = (p̂ + z²/2n) / (1 + z²/n)\`, \`half-width = z √( p̂(1 − p̂)/n + z²/4n² ) / (1 + z²/n)\`

The centre is pulled toward 0.5 by a pseudo-count of \`z²/2 ≈ 2\` observations, which is why it behaves at the edges.

**Clopper–Pearson (exact):** the interval of \`p\` values for which the observed \`k\` is not in a 2.5% tail of the Binomial(\`n\`, \`p\`) distribution. Guaranteed at least 95% coverage, at the cost of being wider than necessary.

**Bootstrap** (Lesson G) resamples the rows; **posterior intervals** put a prior on \`p\` (Beta(1, 1) gives an interval close to Wilson's). All of them widen as \`n\` shrinks; none of them can say anything about bias.`,
  assumptions:`- Independent rows with a common \`p\` — the binomial model. Clustering (Lesson J) breaks it and widens every interval.
- The level (95%) is chosen before the data are seen.
- The interval speaks about the population the sample was drawn from. If the 10 frames are one macro outing, the interval is about macro outings, not about the reviewer in general.`,
  example:`Synthetic. 9 of 10 verdicts correct.

| Method | Low | High |
| Wald | 0.714 | 1.086 |
| Wilson | 0.596 | 0.982 |
| Clopper–Pearson | 0.555 | 0.997 |

The Wald interval is nonsense above 1 and too narrow below. Wilson and the exact interval agree that anything from about 0.56 to 0.98 is consistent with the data — the sheet has told us the reviewer is probably better than a coin, and little else. For contrast, 405 of 500 (Lesson A's candidate) gives Wilson 0.773–0.842; the three methods agree to two decimals once \`n\` is large and \`p̂\` is away from the edges.`,
  pitfall:`Adjusting or inflating a small-sample accuracy because "the sample is small". The point estimate is what it is; the smallness belongs in the interval, the sample-size disclosure and the composition note. The second pitfall is the Wald interval at high accuracy: a 48-of-50 slice reported as "0.96 ± 0.05" (0.906–1.014) is a formula failing, not a measurement.`,
  application:`Use Wilson by default for every proportion the reviewer is scored on — accuracy, pass rate, per-class recall — and Clopper–Pearson when a stakeholder needs a guarantee or when \`k\` is 0 or \`n\`. Print the interval on every per-sheet and per-slice report, and print \`n\` beside it. Never print a proportion from fewer than about 10 rows without both.`,
  diagnostic:{ q:`On a 25-frame sheet the reviewer caught 0 of 0 Barred frames — there were none. The report prints "Barred recall: n/a". A colleague suggests printing 100% with a Wilson interval instead. What is wrong with each choice, and what should the report say?`,
    a:`"n/a" throws away the information that the sheet had no Barred frames, which matters for aggregation. "100%" claims a measurement that was never made — with \`n = 0\` every interval is 0 to 1 and Wilson is undefined. The report should say the class was absent on this sheet (\`n = 0\`) and exclude the sheet from the Barred-recall aggregate while counting it toward the sheet-level pass rate.` },
  exercise:`For the smallest slice in your last evaluation report, compute Wald, Wilson and Clopper–Pearson intervals by hand or with the calculator. Note where they disagree, and rewrite the slice's line in the report so that it carries \`n\` and a Wilson interval.`,
  calc:{ inputs:[["k","Correct rows",9,0,1e9,1],["n","Rows",10,1,1e9,1],["level","Confidence level (%)",95,50,99.9,0.1]],
    compute:(v)=>{ const z=S.zq(1-(1-v.level/100)/2); const w=S.wald(v.k,v.n,z), wi=S.wilson(v.k,v.n,z), cp=S.clopper(v.k,v.n,1-v.level/100);
      return {p:v.k/v.n,waldLo:w[0],waldHi:w[1],wilsonLo:wi[0],wilsonHi:wi[1],cpLo:cp[0],cpHi:cp[1]}; },
    outputs:[["p","p̂",3],["waldLo","Wald low",3],["waldHi","Wald high",3],["wilsonLo","Wilson low",3],["wilsonHi","Wilson high",3],["cpLo","Exact low",3],["cpHi","Exact high",3]],
    expect:{waldLo:0.714,waldHi:1.086,wilsonLo:0.596,wilsonHi:0.982,cpLo:0.555,cpHi:0.997},
    note:"Try 48 of 50, and 0 of 12." } },

{ id:"C", title:"Proportion and classification-metric uncertainty",
  gentle:`Keepers are about 16% of frames. Verdict accuracy is 0.916, which sounds fine, and the photographer says it misses keepers. Both can be true.

**The one idea.** When most frames are not keepers, a reviewer that says "not a keeper" to everything scores well on accuracy while missing every keeper there is. So the keeper class needs its own numbers: **precision** (of the frames it called keepers, how many really were), **recall** (of the real keepers, how many it found) and **F1**, a balance of the two.

**The example in words.** Those three numbers are computed on the keeper group, which is about 80 frames, not on all 500. A number from 80 frames wobbles about two and a half times more than the same number from 500. That is why their uncertainty is larger than accuracy's, and why a keeper recall that looks solid can be much less certain than it reads.

**An everyday version.** A smoke detector that never goes off is right almost every day, because almost every day there is no fire. Its accuracy is superb and it is useless. What you want to know is how many fires it catches.

**So the answer is** to report the keeper metrics with their own intervals. The nine parts show how to compute each one and how wide it really is.`,
  figure:{ title:"Where the keeper numbers come from",
    gentle:`Every square is one frame. Accuracy counts all 500 of them, and most are the grey ones, which the reviewer got right by saying "not a keeper". Precision and recall are computed on the two coloured groups only: the keepers it found and the keepers it missed, 80 frames between them, plus the 26 it wrongly called keepers. The bars below show the result: the accuracy bar is short because it rests on 500 frames, the recall and F1 bars are wide because they rest on about 80.`,
    caption:`Top: the confusion counts as frames. Bottom: accuracy with its Wilson interval against recall and F1 with their bootstrap intervals; the widths differ because the denominators do.`,
    draw:(v,r)=>{ const g=FIG.cells([[v.tp,"f1"],[v.fn,"f2"],[v.fp,"f3"],[v.tn,"f0"]]); const n=v.tp+v.fp+v.fn+v.tn, wi=S.wilson(v.tp+v.tn,n,1.96);
      return [{type:"grid",cells:g.cells,per:g.per,legend:[{cls:"f1",label:`keepers found (${v.tp})`},{cls:"f2",label:`keepers missed (${v.fn})`},{cls:"f3",label:`wrongly called keeper (${v.fp})`},{cls:"f0",label:`correctly not keeper (${v.tn})`}]},
        {type:"intervals",min:0.5,max:1,xlabel:"value with 95% interval",rows:[{label:`accuracy, ${n} rows`,lo:wi[0],hi:wi[1],x:r.acc,cls:"fx"},{label:`keeper recall, ${v.tp+v.fn} rows`,lo:r.rLo,hi:r.rHi,x:r.R,cls:"f1"},{label:"keeper F1",lo:r.f1Lo,hi:r.f1Hi,x:r.F1,cls:"f1"}]}]; } },
  question:`Keepers are about 16% of frames. The reviewer's verdict accuracy on Reference Set 1 is 0.916, which sounds fine, but the photographer says it misses keepers. What do precision, recall and F1 on the Keeper class say, how uncertain are they, and why is their uncertainty not the same as accuracy's?`,
  principle:`Accuracy is a proportion over all rows, so Lesson B's intervals apply directly. Precision and recall are proportions over **subsets whose sizes are themselves random** — the rows the system flagged, the rows that are truly positive — and F1 is a nonlinear function of both. Their sampling distributions are not binomial, their denominators are small when the class is rare, and the analytic standard errors are approximations. The bootstrap gives honest intervals for all of them with one method.`,
  maths:`With true positives \`TP\`, false positives \`FP\` and false negatives \`FN\` on the positive class:

\`precision = TP/(TP + FP)\`, \`recall = TP/(TP + FN)\`, \`F1 = 2PR/(P + R) = 2TP/(2TP + FP + FN)\`

\`F_β = (1 + β²) P R / (β² P + R)\` weights recall \`β\` times as much as precision; \`β = 2\` for the Barred class, where a miss costs more than a false alarm.

Treating the denominator as fixed, \`SE(recall) ≈ √(R(1 − R)/(TP + FN))\` — a binomial on the positive rows only, so with 80 keepers the standard error is roughly \`√6\` times larger than accuracy's on 500 rows. For F1 there is no clean closed form; **resample the rows** (draw 500 rows with replacement from the 500, recompute F1, repeat 2,000 times) and read off the 2.5th and 97.5th percentiles.

**Text similarity** (the \`note\` field) is a continuous score per row; its mean has the usual \`s/√n\` standard error, but the score's *meaning* is the problem, not its variance — see the pitfall.`,
  assumptions:`- The positive class is defined the same way in both the system's output and the ground truth. "Keeper" must mean the same thing to the reviewer and the photographer.
- Rows are exchangeable for the bootstrap: resampling rows assumes rows are the independent unit. If documents are the unit, resample documents (Lesson J).
- The threshold that turns a score into a Keeper verdict is fixed. Sweep it and precision–recall moves along a curve; the curve is the object to compare, not one point on it.`,
  example:`Synthetic, Reference Set 1, Keeper class. 80 true keepers among 500 frames. The reviewer flagged 90: \`TP = 64\`, \`FP = 26\`, \`FN = 16\`, \`TN = 394\`.

Accuracy \`= (64 + 394)/500 = 0.916\`. Precision \`= 64/90 = 0.711\`. Recall \`= 64/80 = 0.800\`. \`F1 = 128/(128 + 26 + 16) = 0.753\`.

A row bootstrap with 2,000 resamples (seeded, so the calculator reproduces it) gives a 95% interval for F1 of **0.673 to 0.821**, and for recall 0.704 to 0.882. Accuracy's Wilson interval is 0.889 to 0.937. The headline number is precise and irrelevant; the number the photographer cares about is imprecise and the only one worth discussing.`,
  pitfall:`Quoting F1 to three decimals with no interval, and comparing two systems' F1 as if the second decimal were stable. With 80 positives, a difference of 0.05 in F1 is inside one interval's width. The text-similarity pitfall is separate: a note that says "crop tighter on the left" and one that says "crop tighter on the right" score nearly identically on any lexical or embedding similarity, and one of them is wrong. **Similarity is not correctness**; validate a similarity score against judged usefulness on a sample before it is allowed to stand in for it (Lesson M's calibration logic applies).`,
  application:`Report Keeper and Barred precision, recall and F_β with bootstrap intervals, and the sheet-level pass rate with a Wilson interval. State the count of positives beside every per-class metric; a per-class number from fewer than about 30 positives is a sketch. For the \`note\` and \`reason\` fields, report judged quality (0–2) from a human sample as the primary metric and similarity only as a tracked proxy with its validated correlation stated.`,
  diagnostic:{ q:`Two candidate releases score F1 = 0.75 and F1 = 0.79 on the Keeper class, 80 positives each, different reference-set draws. The team calls the second a clear improvement. What would you compute before agreeing, and what would make the comparison much sharper?`,
    a:`A bootstrap interval for each F1 (each is roughly ±0.06 wide here, so they overlap heavily) or, better, a bootstrap interval for the *difference*. Sharper: score both releases on the same frames and bootstrap the paired difference (Lesson G), which removes the between-draw variation and usually narrows the interval by a large factor.` },
  exercise:`Pick the rarest class in your evaluation. Write down TP, FP, FN, compute precision, recall, F1 and F2, then bootstrap a 95% interval for F1 with the calculator or a ten-line script. Compare the interval's width to the difference between your last two releases on that class.`,
  calc:{ inputs:[["tp","True positives",64,0,1e7,1],["fp","False positives",26,0,1e7,1],["fn","False negatives",16,0,1e7,1],["tn","True negatives",394,0,1e7,1],["beta","β for F_β",2,0.1,10,0.1]],
    compute:(v)=>{ const {tp,fp,fn,tn}=v, n=tp+fp+fn+tn; const P=tp/(tp+fp), R=tp/(tp+fn), F1=2*tp/(2*tp+fp+fn), b2=v.beta*v.beta, Fb=(1+b2)*P*R/(b2*P+R);
      const boot=S.bootstrapCounts([tp,fp,fn,tn],2000,20240914,(c)=>({f1:2*c[0]/(2*c[0]+c[1]+c[2]),r:c[0]/(c[0]+c[2]),p:c[0]/(c[0]+c[1])}));
      return {acc:(tp+tn)/n,P,R,F1,Fb,f1Lo:boot.f1[0],f1Hi:boot.f1[1],rLo:boot.r[0],rHi:boot.r[1]}; },
    outputs:[["acc","accuracy",3],["P","precision",3],["R","recall",3],["F1","F1",3],["Fb","F_β",3],["f1Lo","F1 bootstrap 95% low",3],["f1Hi","F1 bootstrap 95% high",3],["rLo","recall bootstrap low",3],["rHi","recall bootstrap high",3]],
    expect:{acc:0.916,P:0.711,R:0.800,F1:0.753,f1Lo:0.673,f1Hi:0.821,rLo:0.704,rHi:0.882},
    note:"Row bootstrap, 2,000 resamples, fixed seed. Percentile interval." } },

{ id:"D", title:"Effect sizes and practical significance",
  gentle:`Suppose the three-point gap from Lesson A were real. Is a three-point drop something to block a release over?

**The one idea.** Statistics can say whether a change is probably real. It cannot say whether the change matters; that is a judgement about consequences, and someone has to own it. The size of a change, on a scale that means something to the people affected, is its **effect size**.

**The example in words.** Three points of verdict accuracy on 500 frames is fifteen frames. If they are fifteen keepers sent to the folder, the photographer loses fifteen pictures a trip. If they are fifteen near-misses filed one shelf over, nobody notices. The same number is a big deal or nothing depending on which frames they are.

**An everyday version.** A train three minutes late is a shrug on a cross-country journey and a missed connection on a four-minute change. The lateness is the same; what it costs is not.

**So the answer is** to decide before the evaluation what size of change would matter, and in which frames, and write it down. The nine parts give the scales and the way to state the threshold.`,
  figure:{ title:"From a proportion to a consequence",
    gentle:`The same three points, followed through to what it costs. Along the top row it becomes sixty wrong verdicts a month and then half an hour of re-checking, which nobody would block a release over. Along the bottom row, on the barred class, the same three points becomes a little over half a barred frame a month reaching the publish queue, and one published is serious. The number did not change between the rows; the consequence did.`,
    caption:`Absolute difference × monthly volume × cost per wrong row, on two classes. The top row uses the calculator's volume and minutes; the bottom row uses the example's 20 barred frames a month.`,
    draw:(v,r)=>({type:"steps",rows:[
      {label:"verdict accuracy",boxes:[{text:fmt(r.abs,3),sub:"difference in accuracy"},{text:`${fmt(r.rowsMonth,0)} wrong verdicts`,sub:`× ${tickN(v.vol)} frames a month`},{text:`${fmt(r.minMonth,0)} minutes`,sub:`× ${fmt(v.cost,1)} min per frame`,cls:"ok"}]},
      {label:"barred class",boxes:[{text:fmt(r.abs,3),sub:"the same difference"},{text:`${fmt(r.abs*20,1)} barred frames`,sub:"× 20 barred a month"},{text:"one published",sub:"cannot be undone",cls:"bad"}]}]}) },
  question:`Suppose Lesson A's three-point gap were real. Is a three-point drop in verdict accuracy something to block a release over, or something nobody would notice? Who decides, and on what scale?`,
  principle:`Statistical evidence answers "is there a difference?"; an **effect size** answers "how big?"; and **practical significance** answers "does a difference that big change what we do?". The third question has no statistical answer. It has an operational one — reviewer hours, missed keepers per month, barred frames published — and it must be written down as a **minimum meaningful effect** before the data are looked at, or the data will be allowed to choose it.`,
  maths:`For two proportions the natural effect sizes are the **absolute difference** \`p_A − p_B\` (0.03: thirty more wrong verdicts per thousand frames), the **relative difference** \`(p_A − p_B)/p_B\` (3.7% more errors relative to the candidate), and the **odds ratio** \`[p_A/(1−p_A)] / [p_B/(1−p_B)]\` (1.23). **Cohen's h** \`= 2 asin√p_A − 2 asin√p_B\` puts differences on a scale where equal values are equally detectable at equal \`n\` regardless of where \`p\` sits; 0.2 is conventionally small, and 0.03 at these accuracies is \`h = 0.079\`, very small.

None of these is the effect size that matters. That one is in the units of the decision: \`(p_A − p_B) × frames per month × cost per wrong verdict\`.`,
  assumptions:`- The cost per wrong verdict is roughly constant across rows, or the effect size is computed per class where it is not (a missed Barred frame costs more than a missed Keeper).
- The monthly volume is known well enough for the arithmetic to mean something.
- The minimum meaningful effect was fixed before the comparison was run and is recorded with the comparison.`,
  example:`Synthetic, Lesson A's numbers. Absolute difference 0.030; relative difference 0.037; odds ratio 1.23; Cohen's h 0.079. Those are four ways of saying "small" on scales nobody makes decisions on.

The photographer reviews about 2,000 frames a month and spends about half a minute re-checking a frame the reviewer got wrong. A real three-point drop in verdict accuracy is 60 more wrong verdicts a month, or about 30 minutes of re-checking — not nothing, but nobody's release criterion. The same three points on the Barred class, at about 20 barred frames a month, is 0.6 more barred frames a month reaching the publish queue, and one published is a serious matter. The same effect size is trivial on one class and disqualifying on another; the minimum meaningful effect must be set per class, and the Barred class's minimum is close to zero.`,
  pitfall:`"Significant" read as "important", and its inverse: a large, decision-relevant effect dismissed because \`p > 0.05\` on a small slice. Also: reporting relative differences alone (a "20% improvement" in Barred recall from 0.30 to 0.36 is one extra catch in seventeen).`,
  application:`Every metric the reviewer is judged on carries a written minimum meaningful effect in operational units, set per class where costs differ, and the evaluation report states the observed effect in the same units next to the interval. A release decision compares the interval to that threshold (Lesson L), never the point estimate to zero.`,
  diagnostic:{ q:`The candidate reduces processing time per sheet from 41 s to 39 s, and with 40 sheets the paired difference is highly significant. The team lists it as an improvement in the release note. Is that wrong?`,
    a:`Not wrong, but empty until the minimum meaningful effect for latency is stated. If sheets are processed overnight in batch, 2 s is not an improvement anyone experiences and the note should say "no meaningful change in latency". If a user waits for each sheet, it may well matter. Significance established that the change is real; it said nothing about whether it is worth a line.` },
  exercise:`For your primary metric, write a one-paragraph minimum meaningful effect statement: the decision it supports, the operational consequence of a one-point change in each direction, and the smallest change worth acting on. Do it per class if the classes have different costs. Date it and put it beside the metric definition.`,
  calc:{ inputs:[["pA","Release accuracy",0.84,0,1,0.001],["pB","Candidate accuracy",0.81,0,1,0.001],["vol","Rows per month",2000,1,1e9,1],["cost","Minutes per wrong row",0.5,0,1e4,0.1]],
    compute:(v)=>{ const d=v.pA-v.pB; const oA=v.pA/(1-v.pA), oB=v.pB/(1-v.pB);
      return {abs:d,rel:d/v.pB,orat:oA/oB,h:2*Math.asin(Math.sqrt(v.pA))-2*Math.asin(Math.sqrt(v.pB)),per1000:d*1000,rowsMonth:d*v.vol,minMonth:d*v.vol*v.cost}; },
    outputs:[["abs","absolute difference",3],["rel","relative difference",3],["orat","odds ratio",2],["h","Cohen's h",3],["per1000","extra wrong rows per 1000",0],["rowsMonth","extra wrong rows per month",0],["minMonth","extra minutes per month",0]],
    expect:{abs:0.030,rel:0.037,h:0.079,per1000:30,rowsMonth:60,minMonth:30},
    note:"The last two outputs are the effect size that a decision can use." } },

{ id:"E", title:"Hypothesis tests and statistical power",
  gentle:`Lesson A said the gap was "not significant". Before concluding the candidate is fine, ask the other question: if it really were three points worse, how likely was this evaluation to notice?

**The one idea.** An evaluation that would miss a real change most of the time cannot clear a candidate by not finding one. The chance that an evaluation notices a change of a given size is its **power**. Low power turns "not significant" into "did not look hard enough".

**The example in words.** With 500 frames a side, a real three-point drop is caught only about as often as not: roughly a coin toss. To catch it reliably, say nine times in ten, takes several times as many frames. The lesson computes the number.

**An everyday version.** A thirty-second search of the garden that finds no keys does not mean the keys are not in the garden. Before believing the result, ask how thorough the search was.

**So the answer is** to size the evaluation for the change you need to see before running it, and to say the power beside any "no significant difference". The nine parts derive power and the sample size from the effect you care about.`,
  figure:{ title:"How often a real three-point drop would be noticed",
    gentle:`The left hump is where the measured gap would land if nothing had changed; the right hump is where it would land if the candidate really were three points worse. The dashed lines are the bar the gap has to clear to count as "significant". Only the shaded part of the right hump clears it, and that part is about a quarter of the hump: three times in four, a real drop of exactly this size would go unnoticed.`,
    caption:`Null and alternative sampling distributions of \`p̂_A − p̂_B\`, with the two-sided critical lines at \`± z_{α/2} SE_0\`. The shaded area of the alternative is the power, 0.239 at the defaults. Raise the rows per arm and watch the humps narrow and the shaded share grow.`,
    draw:(v,r)=>{ const d=v.pA-v.pB, pp=(v.pA+v.pB)/2, se0=Math.sqrt(2*pp*(1-pp)/v.n), se1=Math.sqrt(v.pA*(1-v.pA)/v.n+v.pB*(1-v.pB)/v.n), crit=S.zq(1-v.alpha/2)*se0; const w=4*Math.max(se0,se1);
      return {type:"curves",min:Math.min(0,d)-w,max:Math.max(0,d)+w,xlabel:"release minus candidate, if the run were repeated",
        curves:[{mu:0,sd:se0,label:"if nothing changed",cls:"f1"},{mu:d,sd:se1,label:`if the drop is really ${fmt(d,3)}`,cls:"f2",shade:[[-1,-crit],[crit,1]]}],
        marks:[{x:-crit,label:"significant below",cls:""},{x:crit,label:"significant above",cls:""}]}; } },
  question:`Lesson A said the three-point gap was 1.25 standard errors: "not significant". Before concluding the candidate is fine, ask the other question. If the candidate really were three points worse, how likely was this evaluation to notice? And how many frames would it take to notice reliably?`,
  principle:`A **test** fixes a false-alarm rate α (the chance of calling a difference when there is none) and reports whether the data cross that bar. **Power** is the chance of crossing it when a difference of a stated size really exists. A non-significant result from a low-powered evaluation is not evidence of no difference; it is an evaluation that could not have found one. Power is decided by sample size, effect size and α, and it must be computed *before* the run, for the minimum meaningful effect of Lesson D.`,
  maths:`Two-proportion z-test, independent samples, pooled under the null: \`p̄ = (k_A + k_B)/(n_A + n_B)\`, \`SE_0 = √( p̄(1 − p̄)(1/n_A + 1/n_B) )\`, \`z = (p̂_A − p̂_B)/SE_0\`, two-sided \`p = 2(1 − Φ(|z|))\`.

Power for detecting a true difference \`δ\` with \`n\` per arm: the test rejects when \`|p̂_A − p̂_B| > z_{α/2} SE_0\`; under the alternative the difference has mean \`δ\` and standard error \`SE_1 = √( p_A(1−p_A)/n + p_B(1−p_B)/n )\`, so

\`power ≈ 1 − Φ( (z_{α/2} SE_0 − δ)/SE_1 ) + Φ( (−z_{α/2} SE_0 − δ)/SE_1 )\`

Solve for \`n\` numerically to reach a target power (0.8 by convention, higher when a miss is costly). The dependence is on \`1/n\`: halving the detectable effect quadruples the frames needed.`,
  assumptions:`- Independent rows and independent arms. Paired designs (Lesson F) need a different, usually much smaller, \`n\`.
- The alternative effect size is the minimum meaningful one, not the one you hope for.
- α is fixed in advance; one primary metric is named in advance. Testing twelve metrics and forty slices — fifty-two tests — at α = 0.05 finds two or three "significant" regressions in an unchanged system by chance (Lesson N).`,
  example:`Synthetic, Lesson A's numbers. Pooled \`p̄ = 0.825\`, \`SE_0 = 0.0240\`, \`z = 1.25\`, \`p = 0.212\`. Not significant at 0.05.

Power to detect a true three-point drop with 500 frames per arm is **0.239**: three times in four, this evaluation would have missed a regression of exactly the size observed. To reach 80% power for three points takes about **2,517 frames per arm**; for a five-point drop, about 946. The evaluation was designed to notice large regressions only, and nobody had said so.`,
  pitfall:`"Not significant, so no regression" from an evaluation whose power for the effect that matters was never computed. And its twin: a post-hoc power calculation using the *observed* effect, which just restates the p-value in different clothes. Power is computed for the effect you needed to detect, in advance.`,
  application:`Before a reference set is frozen, compute the power it gives for the minimum meaningful effect on each primary metric, per class. Where power is low — it will be, for Barred, at any affordable size — say so in the manifest and move the design toward pairing (Lesson F) and sequential accumulation rather than pretending the set can answer the question.`,
  diagnostic:{ q:`Barred recall is 0.30 on 20 barred frames. A stakeholder asks for an evaluation that would detect an improvement to 0.45 with 80% power. Roughly how many barred frames does that need, and what does the answer imply about how the reference set must be built?`,
    a:`Cohen's h for 0.30 versus 0.45 is about 0.31; with the two-arm formula, roughly 165 barred frames per arm at 80% power (try it in the calculator). At a 4% barred rate that is over 4,000 frames per arm sampled naively. The set must **oversample** barred frames deliberately — and then report other metrics with weights that undo the oversampling (Lesson I).` },
  exercise:`For your primary metric and its minimum meaningful effect, compute the power of your current reference set with the calculator. If it is under 0.8, compute the size that reaches 0.8 and write two sentences on whether that size is affordable and what you will do if it is not.`,
  calc:{ inputs:[["pA","Release accuracy",0.84,0.001,0.999,0.001],["pB","Candidate accuracy (alternative)",0.81,0.001,0.999,0.001],["n","Rows per arm",500,2,1e9,1],["alpha","α",0.05,0.001,0.5,0.001],["target","Target power",0.8,0.05,0.999,0.01]],
    compute:(v)=>{ const kA=Math.round(v.pA*v.n), kB=Math.round(v.pB*v.n); const pp=(kA+kB)/(2*v.n), se0=Math.sqrt(pp*(1-pp)*2/v.n), z=(v.pA-v.pB)/se0;
      return {z,p:2*(1-S.Phi(Math.abs(z))),power:S.power2p(v.pA,v.pB,v.n,v.alpha),nNeed:S.nForPower(v.pA,v.pB,v.alpha,v.target)}; },
    outputs:[["z","z (pooled)",2],["p","two-sided p",3],["power","power at this n",3],["nNeed","n per arm for target power",0]],
    expect:{z:1.25,p:0.212,power:0.239,nNeed:2517},
    note:"Independent two-arm design. A paired design on the same rows needs far fewer; see Lesson F." } },

{ id:"F", title:"Paired comparison of model versions",
  gentle:`It turns out both releases were scored on the same 500 frames. Lesson A treated them as two separate draws. Does that change the answer?

**The one idea.** When every frame was seen by both versions, compare them **frame by frame**. Frames both got right and frames both got wrong say nothing about the difference; the information is in the frames where they disagree. Pairing takes out the wobble the two runs share, because they share the frames.

**The example in words.** Count the frames the release got right and the candidate wrong, and the frames the other way round. If those two counts are far apart the candidate really is different; if they are close it is not. The shared frames make this a much sharper test than comparing two totals, and Lesson A's "cannot tell" can become a definite answer.

**An everyday version.** Two proofreaders read the same manuscript. Compare them page by page: the pages both caught and the pages both missed say nothing about which is better; the pages only one of them caught say everything.

**So the answer is** yes: the design changes the test and usually the verdict. The nine parts derive the paired test and its interval.`,
  figure:{ title:"Only the disagreements carry evidence",
    gentle:`Every square is one of the 500 frames both versions scored. The grey ones are frames both got right or both got wrong; they say nothing about which version is better. The 55 coloured squares are the frames the two versions disagreed on: 35 that only the release got right, 20 that only the candidate did. The bars below show what pairing buys: the same 0.03 gap, but a much shorter bar, because the shared frames' wobble has been taken out.`,
    caption:`Top: the 2×2 agreement table as frames, concordant rows in grey. Bottom: the 95% interval for the difference under independence (Lesson A) against the paired one; both centred on the same \`d\`.`,
    draw:(v,r)=>{ const both=Math.max(0,v.n-v.b-v.c-v.w); const g=FIG.cells([[v.b,"f1"],[v.c,"f2"],[v.w,"fx"],[both,"f0"]]);
      return [{type:"grid",cells:g.cells,per:g.per,legend:[{cls:"f1",label:`only the release right (${v.b})`},{cls:"f2",label:`only the candidate right (${v.c})`},{cls:"fx",label:`both wrong (${v.w})`},{cls:"f0",label:`both right (${both})`}]},
        {type:"intervals",min:Math.min(-0.04,r.d-1.96*r.seInd-0.01),max:Math.max(0.1,r.d+1.96*r.seInd+0.01),xlabel:"release minus candidate, 95% interval",
          rows:[{label:"treated as independent",lo:r.d-1.96*r.seInd,hi:r.d+1.96*r.seInd,x:r.d,cls:"fx"},{label:"paired, frame by frame",lo:r.lo,hi:r.hi,x:r.d,cls:"f1"}],marks:[{x:0,label:"no difference"}]}]; } },
  question:`Both releases were, in fact, scored on the *same* 500 frames. Lesson A treated them as two independent draws and found nothing. Does the shared design change the answer?`,
  principle:`When two systems are scored on the same rows, the row-to-row variation — hard sheets, easy sheets — is shared, and it cancels in the comparison. The evidence about the *difference* lives entirely in the rows where the two systems **disagree**. A paired analysis uses only those rows and is far more sensitive than the independent comparison, which lets the shared variation blur the picture. Always pair when you can, and you almost always can.`,
  maths:`Cross-tabulate the 500 rows by (A right?, B right?). Let \`b\` be the rows A got right and B wrong, \`c\` the rows B got right and A wrong; the rows where both were right or both wrong say nothing about the difference. Under the null of no difference, each discordant row is equally likely to fall either way, so \`b ~ Binomial(b + c, ½)\`.

**McNemar's test:** \`χ² = (b − c)²/(b + c)\` on one degree of freedom; the two-sided \`p\` is \`2(1 − Φ(√χ²))\`. For small \`b + c\` (under about 25) use the exact binomial tail instead.

**The difference and its standard error:** \`d = (b − c)/n\`, \`SE(d) = √( (b + c) − (b − c)²/n ) / n\`, interval \`d ± 1.96 SE(d)\`. Compare that standard error with the independent one from Lesson A: the paired one is smaller whenever \`b + c\` is small relative to what independence would predict, which is whenever the two systems mostly agree — that is, always.`,
  assumptions:`- Identical rows, identical ground truth, identical scoring code and thresholds for both systems. Any of these differing turns a paired comparison into a confounded one (Lesson K).
- Discordant rows are independent of one another. Within a sheet they are not; Lesson J's cluster correction applies to the paired difference too.
- Both systems were run under the same conditions (same document preprocessing, same time limit).`,
  example:`Synthetic, the same 500 frames. Both right on 385, both wrong on 60; **A right and B wrong on 35** (\`b\`), **B right and A wrong on 20** (\`c\`). The totals are still 420 and 405, and the difference is still 0.030.

McNemar: \`χ² = (35 − 20)²/55 = 4.09\`, \`p = 0.043\`; exact binomial on 35 of 55, \`p = 0.058\`. The standard error of the difference is \`√(55 − 225/500)/500 = 0.0148\`, against 0.0240 under independence, and the 95% interval runs from **0.001 to 0.059**. The same three points that Lesson A could not distinguish from noise are, in the paired analysis, borderline evidence of a real regression — and the interval says the regression could be anywhere from nothing to six points, which is the honest state of knowledge.`,
  pitfall:`Running independent-sample tests on paired data, which throws away most of the evidence, and then concluding "no difference" (Lessons A and E). The reverse error: pairing on rows that were *not* actually the same — a re-adjudicated ground truth between runs breaks the pairing silently.`,
  application:`Every comparison between two releases is run on the same frozen reference set with the same scorer, reported as the paired difference with McNemar's test and the paired interval, and the count of discordant rows is printed. The discordant rows themselves are the review queue: 55 frames is an afternoon's reading, and it tells you *what kind* of frame the candidate lost, which no p-value will.`,
  diagnostic:{ q:`Two releases agree on 490 of 500 rows; A wins 8 of the 10 discordant rows. McNemar's χ² is 3.6, p ≈ 0.06; the exact test gives p ≈ 0.11. Which p-value should be reported, and what is the more useful thing to report than either?`,
    a:`The exact one: with 10 discordant rows the χ² approximation is unreliable. More useful than either is the list of the 10 rows. With so few discordances, reading them decides more than testing them — and it may reveal that the 2 rows B won are Barred frames, which no aggregate would show.` },
  exercise:`Re-run your last release comparison as a paired analysis: build the 2×2 agreement table, compute \`b\`, \`c\`, McNemar's statistic and the paired interval. Report how much narrower the interval is than the independent one, and read the discordant rows.`,
  calc:{ inputs:[["b","A right, B wrong (b)",35,0,1e7,1],["c","B right, A wrong (c)",20,0,1e7,1],["w","Both wrong",60,0,1e7,1],["n","Rows scored by both",500,1,1e9,1]],
    compute:(v)=>{ const {b,c,n}=v, m=b+c; const chi=m?(b-c)*(b-c)/m:0; const d=(b-c)/n; const se=Math.sqrt(Math.max(0,m-(b-c)*(b-c)/n))/n;
      const pA=(n-c-v.w)/n, pB=(n-b-v.w)/n, seInd=Math.hypot(S.seProp(pA,n),S.seProp(pB,n)); // Lesson A's formula on the same totals, for comparison
      return {chi,p:m?2*(1-S.Phi(Math.sqrt(chi))):1,pExact:S.binomTwoSided(Math.max(b,c),m),d,se,seInd,lo:d-1.96*se,hi:d+1.96*se,discordant:m}; },
    outputs:[["discordant","discordant rows",0],["chi","McNemar χ²",2],["p","p (χ² approx.)",3],["pExact","p (exact binomial)",3],["d","paired difference",3],["se","SE of paired difference",4],["seInd","SE if treated as independent",4],["lo","95% low",3],["hi","95% high",3]],
    expect:{chi:4.09,p:0.043,pExact:0.058,d:0.030,se:0.0148,seInd:0.0240,lo:0.001,hi:0.059},
    note:"Use the exact p when b + c is under about 25." } },

{ id:"G", title:"Bootstrap and permutation methods",
  gentle:`The photographer's favourite metric is the sheet pass rate: did the reviewer catch every barred frame on the sheet. There are 40 sheets, the two releases differ on it, and no formula so far was made for it.

**The one idea.** When no formula fits, let the computer re-draw the data. **Bootstrap:** draw 40 sheets at random from the 40, with repeats allowed, compute the pass rate, and do it thousands of times; the spread of those pass rates is the uncertainty. **Permutation:** shuffle which release each result belongs to, compute the gap, repeat; that shows how big a gap chance alone makes.

**The example in words.** Both are just repetition. Neither needs a formula for the metric, only a way to compute it once. The machine does the repeating; what you supply is the judgement of what to resample, which here is sheets, not frames.

**An everyday version.** Not sure how much a recipe varies? Cook it again and again and look at the spread of results. The bootstrap does the cooking for you, from the ingredients you already have.

**So the answer is** resample at the level of the thing that is independent. The nine parts set the two methods up and the calculator runs them, seeded so the numbers repeat.`,
  figure:{ title:"Twelve outings, resampled two thousand times",
    gentle:`The top row shows the twelve outings as dots: how much better the release did than the candidate on each, with five sitting exactly on zero. The bar under them is the bootstrap's answer, the range that most of the two thousand re-draws of those twelve landed in, and it just clears zero. The hill below is all two thousand re-draws piled up; the interval is the middle 95% of the hill. Change a difference in the list and the hill moves.`,
    caption:`Per-unit differences \`d_i\`, their mean, and the percentile bootstrap interval; below, the 2,000 resampled means as a histogram with the 2.5th and 97.5th percentiles marked. Seeded, so it is the calculator's interval exactly.`,
    draw:(v,r)=>{ const d=S.parseList(v.diffs); if(d.length<2) return {type:"steps",rows:[{boxes:[{text:"enter at least two differences"}]}]};
      const rg=S.rng(20240914), m=d.length, B=Math.round(v.B), ms=[]; for(let b=0;b<B;b++){ let s=0; for(let i=0;i<m;i++) s+=d[Math.floor(rg()*m)]; ms.push(s/m); }
      const lo=Math.min(-0.1,...d)-0.05, hi=Math.max(0.1,...d)+0.05;
      return [{type:"intervals",min:lo,max:hi,xlabel:"release minus candidate, per outing",rows:[{label:`the ${m} outings`,dots:d,x:r.mean,cls:"f1"},{label:"paired bootstrap 95%",lo:r.lo,hi:r.hi,x:r.mean,cls:"f1"}],marks:[{x:0,label:"no difference"}]},
        {type:"hist",values:ms,bins:40,min:lo,max:hi,cls:"f1",xlabel:`mean difference in each of ${B} re-draws`,marks:[{x:r.lo,label:"2.5%",cls:""},{x:r.hi,label:"97.5%",cls:""},{x:r.mean,label:"observed mean",cls:"f2"}]}]; } },
  question:`The sheet-level pass rate — did the reviewer catch every Barred frame on the sheet — is the metric the photographer trusts most. It is a proportion of sheets, there are 40 of them, and the two releases differ on it. No formula in Lessons A to F was derived for it. What now?`,
  principle:`When the metric is awkward — a ratio, a maximum, an F-score, a pass rate over documents — or the sampling unit is not a row, stop deriving and **resample**. The **bootstrap** re-draws the data with replacement from itself, recomputes the metric each time, and uses the spread of those recomputations as the sampling distribution. A **permutation test** asks a different question: if the labels "A" and "B" were meaningless, how often would a reshuffle produce a difference this large? Both are exact in spirit, need no formula, and inherit their honesty from one decision: **what unit gets resampled**.`,
  maths:`**Paired bootstrap for a difference over units.** For units \`i = 1..m\` (sheets) with paired outcomes \`(a_i, b_i)\`, compute \`d_i = a_i − b_i\`. Draw \`m\` units with replacement, compute the mean difference, repeat \`B\` times (2,000 is plenty for a 95% interval), take the 2.5th and 97.5th percentiles. Resampling *pairs* keeps the within-unit correlation that makes the paired design powerful.

**Sign-flip permutation test.** Under the null that A and B are exchangeable, each \`d_i\` is as likely to be \`−d_i\`. Flip the sign of each \`d_i\` at random, compute the mean, repeat; the \`p\`-value is the fraction of flips whose \`|mean|\` reaches the observed \`|d̄|\`. With \`m = 12\` there are \`2¹² = 4,096\` flips and the test can be enumerated exactly.

**Cluster bootstrap.** When rows sit inside documents, resample documents and keep every row of each drawn document. This is the row bootstrap of Lesson C done at the right level, and it is the tool that makes Lesson J's design effect unnecessary to estimate by hand.`,
  assumptions:`- The units resampled are exchangeable: sheets are a fair sample of sheets, and one sheet's outcome does not depend on another's.
- The number of units is not tiny. Below about 10 units the bootstrap percentile interval is too narrow; use the permutation test's exact enumeration and say the sample is small.
- The seed is recorded, so the interval is reproducible; reproducibility controls the draw you can recreate, not the uncertainty.`,
  example:`Synthetic. Twelve outings from Reference Set 1 with two or more Barred frames each, scored by both releases on Barred recall per outing (fraction of that outing's barred frames caught):

| Outing | A | B | d = A − B |
| 1 | 1.00 | 0.50 | 0.50 |
| 2 | 0.67 | 0.67 | 0.00 |
| 3 | 0.50 | 0.50 | 0.00 |
| 4 | 1.00 | 1.00 | 0.00 |
| 5 | 0.75 | 0.50 | 0.25 |
| 6 | 0.50 | 0.00 | 0.50 |
| 7 | 1.00 | 1.00 | 0.00 |
| 8 | 0.33 | 0.67 | −0.33 |
| 9 | 1.00 | 0.50 | 0.50 |
| 10 | 0.50 | 0.50 | 0.00 |
| 11 | 0.67 | 0.33 | 0.33 |
| 12 | 1.00 | 0.75 | 0.25 |

Mean difference \`d̄ = 0.167\` in A's favour. Paired bootstrap, 2,000 resamples, seeded: 95% interval **0.022 to 0.305**. Exact sign-flip permutation over all 4,096 assignments: \`p = 0.078\`.

The two methods disagree at the margin, and that is the lesson of a twelve-unit sample: the bootstrap interval excludes zero, the permutation test does not reach 0.05, and neither is wrong. The permutation test is exact but coarse — five of the twelve differences are zero and contribute nothing to it — while the percentile bootstrap on twelve units runs a little narrow. The honest report is "suggestive, not established: the candidate probably catches fewer barred frames per outing, on the metric the photographer cares about, and twelve more outings with barred frames would settle it".`,
  pitfall:`Bootstrapping rows when the question is about documents (an interval far too narrow), or bootstrapping the two systems separately and comparing the intervals (throwing the pairing away, Lesson F's mistake in new clothes). And reporting a permutation \`p\` without the effect size and interval beside it.`,
  application:`Sheet-level metrics — pass rate, per-outing Barred recall, time per sheet — are compared with a paired bootstrap over sheets and a sign-flip permutation test, seed recorded in the report. Row-level metrics on Reference Set 1 use a cluster bootstrap over outings as the standard interval, replacing the independent-row formulas of Lessons A to C once the clustering has been shown to matter (Lesson J).`,
  diagnostic:{ q:`A colleague bootstraps the row-level accuracy of a release by resampling 500 rows, gets an interval of ±0.032, and notes it matches Lesson A's formula. Is the match reassuring?`,
    a:`It is expected, not reassuring: a row bootstrap and the binomial formula make the same independence assumption, so they agree with each other even when both are wrong. The check that would mean something is a *cluster* bootstrap over the 40 outings. If that interval is much wider, the rows are not independent and the agreement was two methods sharing a mistake.` },
  exercise:`Take a document-level metric from your evaluation, paired across two releases. Compute the paired bootstrap interval and the sign-flip permutation \`p\` with the calculator (paste your per-document differences) or a short script. Then compute the row-level interval the old way and record the ratio of widths.`,
  calc:{ inputs:[["diffs","Per-unit differences (A − B), comma-separated","0.5,0,0,0,0.25,0.5,0,-0.33,0.5,0,0.33,0.25",null,null,null],["B","Bootstrap resamples",2000,100,20000,100]],
    compute:(v)=>{ const d=S.parseList(v.diffs); if(d.length<2) return {m:d.length,mean:NaN,lo:NaN,hi:NaN,pPerm:NaN};
      const mean=S.mean(d); const bs=S.bootstrapMean(d,Math.round(v.B),20240914); const pp=S.signFlipP(d,20240914);
      return {m:d.length,mean,lo:bs[0],hi:bs[1],pPerm:pp}; },
    outputs:[["m","units",0],["mean","mean difference",3],["lo","paired bootstrap 95% low",3],["hi","paired bootstrap 95% high",3],["pPerm","sign-flip permutation p",3]],
    expect:{m:12,mean:0.167,lo:0.022,hi:0.305,pPerm:0.078},
    note:"Up to 16 units the permutation test enumerates every sign assignment exactly; beyond that it samples 20,000." } },

{ id:"H", title:"Class imbalance and metric aggregation",
  gentle:`Verdict accuracy is 0.892 and the release note says "near 90%". Barred frames are 2% of rows and the reviewer catches 3 in 10 of them.

**The one idea.** An average over everything is dominated by whatever is common. The barred frames are rare, so their catastrophe barely moves the average. Which **aggregate** you report decides what can hide in it.

**The example in words.** Of 500 frames about ten are barred. Missing seven of them costs the accuracy about one point, and the note still says near 90%. Report the barred recall on its own line and the story is 3 in 10, which is the story that matters, because a barred frame published is the one mistake that cannot be undone.

**An everyday version.** A school's average mark is set by its big classes. If the smallest class failed outright, the average barely moves. Look at the class marks, not the school's.

**So the answer is** to report per-class numbers and to choose the average deliberately. The nine parts compare the ways of averaging and show what each one hides.`,
  figure:{ title:"What each average is made of",
    gentle:`Each bar is one verdict class; its width is how many frames the class has, its height is how many of them the reviewer got right. The wide grey bar is the folder class, and it sets the accuracy line almost by itself. The barred class is the thin bar at the right: it is the one that matters, it is the lowest, and it is nearly invisible to the average, which is the point. The macro line treats the four bars as equals and lands much lower.`,
    caption:`A mosaic of per-class recall: width proportional to true rows, height the recall. Micro recall (accuracy) is the area-weighted mean; macro recall weights the four bars equally. Set the Barred cost weight to see the cost-weighted line move between them.`,
    draw:(v,r)=>({type:"bars",max:1,ylabel:"recall",bars:[{label:"Folder",sub:`${v.n1} rows`,width:v.n1,value:r.rFolder,cls:"f0"},{label:"Keeper",sub:`${v.n2} rows`,width:v.n2,value:r.rKeeper,cls:"f1"},{label:"Near miss",sub:`${v.n3} rows`,width:v.n3,value:r.rNear,cls:"f3"},{label:"Barred",sub:`${v.n4} rows`,width:v.n4,value:r.rBarred,cls:"f2"}],
      ylines:[{y:r.micro,label:`micro ${fmt(r.micro,3)}`},{y:r.macro,label:`macro ${fmt(r.macro,3)}`},{y:r.weighted,label:`cost-weighted ${fmt(r.weighted,3)}`,cls:"f2"}]}) },
  question:`Verdict accuracy is 0.892 and the release note calls it "near 90%". Barred frames are 2% of rows and the reviewer catches 3 in 10 of them. How does one number hide the other, and which aggregate should have been reported?`,
  principle:`Every aggregate is a weighted sum, and the weights are a decision. **Micro** averages weight by rows, so the majority class sets the number. **Macro** averages weight classes equally, so a 2% class counts as much as a 78% one. Neither is right in general; the right weights are the costs of the errors, and when the costs are unknown, report per class. Aggregating across groups with different mixes can even reverse the ranking of two systems — **Simpson's paradox** — and it does so in evaluation more often than in textbooks, because reference sets are built from whatever was available.`,
  maths:`With classes \`c\` having \`n_c\` true rows and \`k_c\` correctly recovered: micro-averaged recall \`= Σ k_c / Σ n_c\` (which for single-label classification equals accuracy), macro-averaged recall \`= (1/C) Σ k_c/n_c\`. Macro-F1 is the mean of per-class F1s; micro-F1 collapses to accuracy. A **cost-weighted** aggregate \`Σ w_c k_c/n_c\` with weights from the minimum-meaningful-effect statement is the only one that answers an operational question.

**Simpson's paradox** in one line: if \`p_B > p_A\` in every stratum but the strata have different sizes in the two systems' evaluations, the pooled proportions can order the other way, because pooled \`p = Σ (n_s/n) p_s\` is a different weighted average for each system.`,
  assumptions:`- Class labels are mutually exclusive and exhaustive, so micro-recall equals accuracy. Multi-label fields (\`relations\`) need per-link precision and recall instead.
- The reference set's class mix is either the production mix, or is known and reweighted to it (Lesson I).
- The costs behind the weights are the ones written down in Lesson D, not ones chosen after seeing which weighting flatters the release.`,
  example:`Synthetic, Reference Set 1, per-class verdict recall:

| Class | True rows | Recovered | Recall |
| Folder | 400 | 380 | 0.950 |
| Keeper | 60 | 45 | 0.750 |
| Near miss | 30 | 18 | 0.600 |
| Barred | 10 | 3 | 0.300 |

Micro-recall (accuracy) \`= 446/500 = 0.892\`. Macro-recall \`= (0.95 + 0.75 + 0.60 + 0.30)/4 = 0.650\`. The class whose errors cost most contributes 2% of the first number and 25% of the second, and neither is the cost-weighted figure the decision needs.

Simpson, synthetic: two releases evaluated on different mixes of safari and home-ground sheets.

| | Safari | Home ground | Pooled |
| A | 380/400 = 0.950 | 72/100 = 0.720 | 452/500 = 0.904 |
| B | 96/100 = 0.960 | 290/400 = 0.725 | 386/500 = 0.772 |

B is better on safari *and* on home ground, and worse pooled, because B was evaluated mostly on the harder scenario. The pooled number is not about the systems; it is about the mixes.`,
  pitfall:`Headlining accuracy, or micro-F1, on an imbalanced task; choosing between micro and macro after seeing which one moved in the right direction; and comparing pooled numbers across evaluations with different mixes. A subtler one: averaging per-sheet accuracies (macro over documents) when sheets vary in length — a 5-frame sheet then weighs the same as a 25-frame one, which may or may not be what the decision wants.`,
  application:`Reference Set 1's report leads with the per-class table and the cost-weighted aggregate, then accuracy as context. Pooled comparisons between releases are only made on identical mixes (same frozen set; Lesson K), and any cross-mix comparison is stratified first (Lesson I). The Barred row is printed first, with its \`n\`, because it is the one that decides.`,
  diagnostic:{ q:`A candidate improves macro-F1 from 0.65 to 0.70 and lowers accuracy from 0.892 to 0.880. The team splits on whether it is better. What question resolves the split without more data?`,
    a:`Which classes moved, and what each class's errors cost. The per-class table will show whether the macro gain came from Barred or Near miss (which cost) and whether the accuracy loss is Folder frames being sent for a second look (which is cheap). With the Lesson D cost weights, the two numbers collapse into one cost-weighted comparison and the split disappears; without them, the disagreement is about values, not statistics.` },
  exercise:`Build the per-class recall table for your last evaluation, compute micro and macro recall, then a cost-weighted version with weights from your minimum-meaningful-effect statement. Find one stratum split (scenario, source, difficulty) and check whether the pooled ranking of your last two releases survives it.`,
  calc:{ inputs:[["n1","Folder: true rows",400,0,1e7,1],["k1","Folder: recovered",380,0,1e7,1],["n2","Keeper: true rows",60,0,1e7,1],["k2","Keeper: recovered",45,0,1e7,1],["n3","Near miss: true rows",30,0,1e7,1],["k3","Near miss: recovered",18,0,1e7,1],["n4","Barred: true rows",10,0,1e7,1],["k4","Barred: recovered",3,0,1e7,1],["w4","Cost weight: Barred (others 1)",20,0,1e4,1]],
    compute:(v)=>{ const ns=[v.n1,v.n2,v.n3,v.n4], ks=[v.k1,v.k2,v.k3,v.k4]; const rec=ns.map((n,i)=>n?ks[i]/n:NaN); const valid=rec.filter(x=>!isNaN(x));
      const micro=S.sum(ks)/S.sum(ns), macro=S.mean(valid); const w=[1,1,1,v.w4]; let ws=0,wt=0; rec.forEach((r,i)=>{ if(!isNaN(r)){ws+=w[i]*r;wt+=w[i];} });
      return {micro,macro,weighted:ws/wt,rFolder:rec[0],rKeeper:rec[1],rNear:rec[2],rBarred:rec[3]}; },
    outputs:[["micro","micro recall (= accuracy)",3],["macro","macro recall",3],["weighted","cost-weighted recall",3],["rFolder","Folder recall",3],["rKeeper","Keeper recall",3],["rNear","Near-miss recall",3],["rBarred","Barred recall",3]],
    expect:{micro:0.892,macro:0.650,rBarred:0.300},
    note:"The cost weight is a decision, made before the data. Set it to 1 to see macro recall; to 0 to see how the aggregate looks when Barred is ignored." } },
