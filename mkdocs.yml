site_name: Trustworthy AI Evaluation
site_description: Experimental Design, Metrics, Confidence, and Decision-Making for AI Engineers
site_url: https://dermot-r-cochran.github.io/applied-statistics-for-AI-engineers/
repo_url: https://github.com/dermot-r-cochran/applied-statistics-for-AI-engineers
repo_name: dermot-r-cochran/applied-statistics-for-AI-engineers
edit_uri: edit/main/
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Copyright 2026 Dermot R. Cochran

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: lime
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Orientation:
      - Why this book exists: introduction.md
      - Project Frog: project_frog.md
      - How to use the repository: using_the_repository.md
  - Part I · Statistical foundations:
      - 1. Probability foundations: 01_probability_foundations.md
      - 2. Sampling and variation: 02_sampling_and_variation.md
      - 3. Confidence intervals: 03_confidence_intervals.md
      - 4. Hypothesis testing: 04_hypothesis_testing.md
      - 5. Effect size: 05_effect_size.md
      - 6. Statistical power: 06_statistical_power.md
      - 7. Bootstrap methods: 07_bootstrap_methods.md
      - 8. Bayesian reasoning: 08_bayesian_reasoning.md
  - Part II · Metrics and comparison:
      - 9. Classification metrics: 09_classification_metrics.md
      - 10. Metric uncertainty: 10_metric_uncertainty.md
      - 11. Model comparison: 11_model_comparison.md
  - Part III · Evaluation design:
      - 12. Experimental design: 12_experimental_design.md
      - 13. A/B testing: 13_ab_testing.md
      - 14. Test set design: 14_test_set_design.md
      - 15. Sampling bias: 15_sampling_bias.md
      - 16. Data leakage: 16_data_leakage.md
  - Part IV · Decisions and monitoring:
      - 17. Measurement theory: 17_measurement_theory.md
      - 18. Decision theory: 18_decision_theory.md
      - 19. Monitoring under uncertainty: 19_monitoring_under_uncertainty.md
  - Practical workshops:
      - Tutorials overview: workshops.md
      - Confidence-interval notebook: workshops/confidence_intervals_for_accuracy.ipynb
      - Project Frog case studies: case_studies/index.md
      - Case study 1 · The Shrinking Pond: case_studies/01_the_shrinking_pond.md
      - Case study 2 · Frog Leap: case_studies/02_frog_leap.md
      - Case study 3 · Different Pond: case_studies/03_different_pond.md
      - Case study 4 · The Tadpole Problem: case_studies/04_the_tadpole_problem.md
      - Case study 5 · Release Readiness: case_studies/05_release_readiness.md
  - Contributing and local development: developer_guide.md
