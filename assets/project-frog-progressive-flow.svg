<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Project Frog progressive evaluation flow</title>
  <desc id="desc">A sequence of five connected boxes showing decision framing, sample inspection, metric review, uncertainty, and release interpretation.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .box2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .box3 { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 14; }
      .box4 { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 14; }
      .label { font: 700 20px sans-serif; fill: #0f172a; }
      .sub { font: 400 14px sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 3; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="240" />
  <rect class="box" x="20" y="40" width="160" height="110" rx="14"/>
  <text class="label" x="40" y="80">Decision</text>
  <text class="sub" x="40" y="108">What evidence is</text>
  <text class="sub" x="40" y="128">good enough to act?</text>
  <line class="arrow" x1="180" y1="95" x2="220" y2="95"/>
  <rect class="box2" x="220" y="40" width="160" height="110" rx="14"/>
  <text class="label" x="240" y="80">Sample</text>
  <text class="sub" x="240" y="108">Which cases were</text>
  <text class="sub" x="240" y="128">actually measured?</text>
  <line class="arrow" x1="380" y1="95" x2="420" y2="95"/>
  <rect class="box" x="420" y="40" width="160" height="110" rx="14"/>
  <text class="label" x="440" y="80">Metric</text>
  <text class="sub" x="440" y="108">Where do aggregate</text>
  <text class="sub" x="440" y="128">results hide risk?</text>
  <line class="arrow" x1="580" y1="95" x2="620" y2="95"/>
  <rect class="box3" x="620" y="40" width="160" height="110" rx="14"/>
  <text class="label" x="640" y="80">Uncertainty</text>
  <text class="sub" x="640" y="108">What range of</text>
  <text class="sub" x="640" y="128">performance is plausible?</text>
  <line class="arrow" x1="780" y1="95" x2="820" y2="95"/>
  <rect class="box4" x="820" y="40" width="120" height="110" rx="14"/>
  <text class="label" x="840" y="80">Release</text>
  <text class="sub" x="840" y="108">Ship, caveat,</text>
  <text class="sub" x="840" y="128">or hold?</text>
</svg>
